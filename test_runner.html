<script src="app.js" onerror="document.getElementById('output').innerHTML += '\nSCRIPT LOAD FAILED for app.js'"></script>
<script>
(async function runTests() {
  const log = (msg) => {
    document.getElementById('output').innerHTML += "\n" + msg;
    console.log(msg);
  };

  document.getElementById('output').innerHTML = "=== RUNNING TESTS ===";

  let passed = 0;
  let failed = 0;

  function assert(condition, message) {
    if (condition) {
      log("✓ PASS: " + message);
      passed++;
    } else {
      log("✗ FAIL: " + message);
      failed++;
    }
  }

  // TEST 1: Canonical product resolution for all aliases
  const testCases = [
    { in: 'MOHABBATH', expectedId: 'prod_mg', expectedName: 'Mohabbath Green' },
    { in: 'mohabbath green', expectedId: 'prod_mg', expectedName: 'Mohabbath Green' },
    { in: 'DOUBLE CHABI WHITE SELLA', expectedId: 'prod_dcw', expectedName: 'White Chabi' },
    { in: 'DC White', expectedId: 'prod_dcw', expectedName: 'White Chabi' },
    { in: 'White Chabi', expectedId: 'prod_dcw', expectedName: 'White Chabi' },
    { in: 'DOUBLE CHABI GOLD SELLA', expectedId: 'prod_dcg', expectedName: 'Golden Chabi' },
    { in: 'DC Gold', expectedId: 'prod_dcg', expectedName: 'Golden Chabi' },
    { in: 'Golden Chabi', expectedId: 'prod_dcg', expectedName: 'Golden Chabi' },
    { in: 'SM 3ROSE 2ND', expectedId: 'prod_jmt', expectedName: 'JMT Rose 2nd' },
    { in: 'JMT Rose 2nd', expectedId: 'prod_jmt', expectedName: 'JMT Rose 2nd' },
    { in: 'JASMINE', expectedId: 'prod_jas', expectedName: 'Jasmine' },
    { in: 'JOKER', expectedId: 'prod_joker', expectedName: 'Joker' },
    { in: 'DAAWAT XXXL GOLD SELLA', expectedId: 'prod_daawat', expectedName: 'Daawat XXXL Gold Sella' },
    { in: 'ROYAL GOLD', expectedId: 'prod_royalgold', expectedName: 'Royal Gold' },
    { in: 'ROYAL WHITE', expectedId: 'prod_royalwhite', expectedName: 'Royal White' }
  ];

  testCases.forEach(tc => {
    const res = getCanonicalProduct(tc.in);
    assert(res && res.id === tc.expectedId && res.name === tc.expectedName,
      `getCanonicalProduct('${tc.in}') => id: ${tc.expectedId}, name: '${tc.expectedName}'`);
  });

  // TEST 2: Deduplication with noisy input containing all duplicate variants
  const noisyProducts = [
    { id: 'p_1', name: 'MOHABBATH', category: 'Kaima', bagSize: 26, defaultRateKg: 98 },
    { id: 'prod_mg', name: 'Mohabbath Green', category: 'Kaima', bagSize: 26, defaultRateKg: 98, imageUrl: 'data:image/svg+xml;base64,AAA' },
    { id: 'p_2', name: 'DOUBLE CHABI WHITE SELLA', category: 'Basmati', bagSize: 30, defaultRateKg: 90 },
    { id: 'prod_dcw', name: 'DC White', category: 'Basmati', bagSize: 30, defaultRateKg: 90 },
    { id: 'p_3', name: 'White Chabi', category: 'Basmati', bagSize: 30, defaultRateKg: 90 },
    { id: 'p_4', name: 'DOUBLE CHABI GOLD SELLA', category: 'Basmati', bagSize: 30, defaultRateKg: 92 },
    { id: 'prod_dcg', name: 'DC Gold', category: 'Basmati', bagSize: 30, defaultRateKg: 92 },
    { id: 'p_5', name: 'SM 3ROSE 2ND', category: 'Other', bagSize: 26, defaultRateKg: 88 },
    { id: 'prod_jmt', name: 'JMT Rose 2nd', category: 'Other', bagSize: 26, defaultRateKg: 88 },
    { id: 'p_demo', name: 'Wayanadan Kaima Rice', category: 'Kaima', bagSize: 26 }, // Demo sample
    { id: 'p_agg', name: 'Mohabbath Green (+2 more)', category: 'Kaima' } // Aggregate order text
  ];

  const cleaned = deduplicateProductsList(noisyProducts, false);

  assert(cleaned.length >= 6, `Cleaned products count is at least 6 (actual: ${cleaned.length})`);
  
  // Verify no duplicate names exist
  const namesSet = new Set();
  let hasDuplicateName = false;
  cleaned.forEach(p => {
    const low = p.name.toLowerCase();
    if (namesSet.has(low)) hasDuplicateName = true;
    namesSet.add(low);
  });
  assert(!hasDuplicateName, "Zero duplicate product names in cleaned catalog");

  // Verify demo sample and aggregate text were purged
  const hasDemo = cleaned.some(p => p.name.includes('Wayanadan') || p.name.includes('more)'));
  assert(!hasDemo, "Demo sample and aggregate text purged from catalog");

  // Verify image was preserved during merge
  const mgProd = cleaned.find(p => p.id === 'prod_mg');
  assert(mgProd && mgProd.imageUrl === 'data:image/svg+xml;base64,AAA', "Custom product image preserved during deduplication merge");

  // TEST 3: Customer alias mapping
  const testCustomers = [
    { id: 'c1', name: 'MAJ', town: 'Angamaly' },
    { id: 'c2', name: 'MAJ Angamaly', town: 'Ernakulam' },
    { id: 'c3', name: 'PKBR ELAMAKKARA', town: 'Ernakulam' },
    { id: 'c4', name: 'Al-Safi Food Court, Pukkattupady', town: 'Ernakulam' },
    { id: 'c5', name: 'EDAKKATTU BAZAAR', town: 'Ernakulam' },
    { id: 'c6', name: 'Edakkat Basmati', town: 'Ernakulam' },
    { id: 'c7', name: 'Edakkat Enterprises Bypass', town: 'Ernakulam' },
    { id: 'c8', name: 'MAK Aluva', town: 'Aluva' },
    { id: 'c9', name: 'MK Aluva', town: 'Aluva' },
    { id: 'c10', name: 'Marwa Aluva', town: 'Aluva' },
    { id: 'c11', name: 'Southern Aluva', town: 'Aluva' },
    { id: 'c12', name: 'ALUVA TRADING COMPANY', town: 'Aluva' }
  ];

  const dedupedCust = deduplicateCustomersList(testCustomers, false);

  // MAJ Angamaly should merge into MAJ
  const majMatches = dedupedCust.filter(c => c.name.toLowerCase().includes('maj'));
  assert(majMatches.length === 1 && majMatches[0].name === 'MAJ', `MAJ Angamaly merged into single 'MAJ' (actual: ${majMatches.map(c=>c.name).join(', ')})`);

  // PKBR ELAMAKKARA should be normalized to PKBR
  const pkbrMatches = dedupedCust.filter(c => c.name.toLowerCase().includes('pkbr'));
  assert(pkbrMatches.length === 1 && pkbrMatches[0].name === 'PKBR', `PKBR ELAMAKKARA normalized to 'PKBR' (actual: ${pkbrMatches.map(c=>c.name).join(', ')})`);

  // Al-Safi Food Court, Pukkattupady should be normalized to Al-Safi Food Court
  const safiMatches = dedupedCust.filter(c => c.name.toLowerCase().includes('safi'));
  assert(safiMatches.length === 1 && safiMatches[0].name === 'Al-Safi Food Court', `Al-Safi Food Court, Pukkattupady normalized to 'Al-Safi Food Court'`);

  // TEST 4: Riyas and Riyas Traders deduplication
  const riyasTestCustomers = [
    { id: 'c_manual', name: 'Riyas', phone: '9847111222', town: 'Ernakulam' },
    { id: 'c_hist_062', name: 'Riyas Traders', town: 'Ernakulam', category: 'Wholesaler' }
  ];
  const dedupedRiyas = deduplicateCustomersList(riyasTestCustomers, false);
  const riyasMatches = dedupedRiyas.filter(c => c.name.toLowerCase().includes('riyas'));
  assert(riyasMatches.length === 1 && riyasMatches[0].name === 'Riyas Traders', `'Riyas' merged into single 'Riyas Traders' (actual: ${riyasMatches.map(c=>c.name).join(', ')})`);
  assert(riyasMatches[0].phone === '9847111222', "Phone number preserved on merged Riyas Traders");

  // TEST 5: Pre-November customer catalog integrity
  assert(typeof PRE_NOVEMBER_CANONICAL_CUSTOMERS !== 'undefined', "PRE_NOVEMBER_CANONICAL_CUSTOMERS is defined");
  assert(PRE_NOVEMBER_CANONICAL_CUSTOMERS.length === 69, `PRE_NOVEMBER_CANONICAL_CUSTOMERS has exactly 69 customers (actual: ${PRE_NOVEMBER_CANONICAL_CUSTOMERS.length})`);
  assert(PRE_NOVEMBER_CANONICAL_CUSTOMERS.some(c => c.name === 'Riyas Traders'), "'Riyas Traders' is present in pre-November customers");
  assert(!PRE_NOVEMBER_CANONICAL_CUSTOMERS.some(c => c.name === 'Riyas'), "'Riyas' alone is NOT present in pre-November customers");

  // Edakkat group: all 3 must remain separate
  assert(dedupedCust.some(c => c.name === 'EDAKKATTU BAZAAR'), "EDAKKATTU BAZAAR preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'Edakkat Basmati'), "Edakkat Basmati preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'Edakkat Enterprises Bypass'), "Edakkat Enterprises Bypass preserved as separate customer");

  // Aluva group: all 5 must remain separate
  assert(dedupedCust.some(c => c.name === 'MAK Aluva'), "MAK Aluva preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'MK Aluva'), "MK Aluva preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'Marwa Aluva'), "Marwa Aluva preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'Southern Aluva'), "Southern Aluva preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'ALUVA TRADING COMPANY'), "ALUVA TRADING COMPANY preserved as separate customer");

  // TEST 6: Product update persistence (bag size and rate customization)
  const testProdCatalog = [

    assert(getAuthLockRemainingSeconds() === 0 && document.getElementById('btnAdminSignIn')?.disabled === false,
      "resetAuthFailureCounters clears lockout cleanly");

    // D. Authorized Admin user unlocks shell, hydrates orders, attaches listeners + delivery_dispatch sync
    localStorage.setItem(STORAGE_ORDERS, JSON.stringify([{
      id: 'ORD-SEC-1',
      date: '2026-11-26',
      dispatchStatus: 'Pending',
      deliveryStatus: 'Normal',
      customer: { id: 'c_sec_1', name: 'Secret Wholesale', town: 'Aluva', district: 'Ernakulam', category: 'Wholesaler', ownerPhone: '9847011111', staffPhone: '9847022222', panchayath: 'Aluva East' },
      items: [{ productId: 'prod_mg', productName: 'Mohabbath Green', bagSize: 26, bagQty: 10, totalKg: 260, perKgRate: 100, totalAmount: 26000 }],
      totalKg: 260,
      totalAmount: 26000,
      paidAmount: 5000,
      balanceDue: 21000,
      paymentMode: 'Credit'
    }]));
    localStorage.setItem(STORAGE_CUSTOMERS, JSON.stringify([{ id: 'c_sec_1', name: 'Secret Wholesale', town: 'Aluva', district: 'Ernakulam' }]));
    mockAuthObj.currentUser = { uid: 'admin_uid_1', email: 'owner@thirdman.test', isAnonymous: false };
    await capturedAuthCb(mockAuthObj.currentUser);
    assert(canAccessAdminData() === true && !document.body.classList.contains('auth-locked'),
      "Verified Admin account unlocks dashboard shell");
    assert((document.getElementById('securityAdminEmailDisplay')?.textContent || '').includes('owner@thirdman.test'),
      "Settings security tab displays verified Admin email");
    assert(orders.some(o => o.id === 'ORD-SEC-1'),
      "Orders hydrate strictly AFTER verified Admin sign-in");
    assert(dispatchListenerAttached === true && typeof dispatchListenerOnNext === 'function',
      "delivery_dispatch two-way realtime listener attaches upon Admin authentication");

    // 3. Delivery projection schema isolation (keeps per-order billing, strips admin PII/ledger fields)
    const secOrder = orders.find(o => o.id === 'ORD-SEC-1');
    const dispatchProj = buildDeliveryDispatchPayload(secOrder);
    assert(dispatchProj.totalAmount === 26000 && dispatchProj.items[0].perKgRate === 100,
      "buildDeliveryDispatchPayload preserves per-order billing amount and per-kg rate");
    assert(!('paidAmount' in dispatchProj) && !('balanceDue' in dispatchProj) && !('paymentMode' in dispatchProj),
      "buildDeliveryDispatchPayload strips accounting/ledger fields (paidAmount, balanceDue, paymentMode)");
    assert(!('ownerPhone' in dispatchProj.customer) && !('staffPhone' in dispatchProj.customer) && !('panchayath' in dispatchProj.customer) && !('category' in dispatchProj.customer),
      "buildDeliveryDispatchPayload strips sensitive customer directory metadata (ownerPhone, staffPhone, panchayath, category)");

    // 4. Two-way delivery_dispatch driver update mirrors into master order
    dispatchListenerOnNext({
      empty: false,
      forEach: (cb) => cb({
        id: 'ORD-SEC-1',
        data: () => ({
          id: 'ORD-SEC-1',
          dispatchStatus: 'Delivered',
          deliveredAt: '2026-11-26T10:30:00.000Z',
          deliveryNote: 'Cash collected from manager',
          updatedAt: '2099-01-01T00:00:00.000Z'
        })
      })
    });
    const updatedMasterOrd = orders.find(o => o.id === 'ORD-SEC-1');
    assert(updatedMasterOrd && updatedMasterOrd.dispatchStatus === 'Delivered' && updatedMasterOrd.deliveryNote === 'Cash collected from manager',
      "delivery_dispatch listener mirrors driver Delivered status and remarks back to master orders");
    assert(masterOrderWrites.some(w => w.docId === 'ORD-SEC-1' && w.payload.dispatchStatus === 'Delivered'),
      "Driver dispatch status update is mirrored back to master orders collection in Firestore");

    // 5. Sign Out & Lock wipes in-memory data, DOM tables, and localStorage caches
    signOutAndLockDashboard('Test sign out');
    assert(canAccessAdminData() === false && document.body.classList.contains('auth-locked'),
      "signOutAndLockDashboard re-locks DOM immediately");
    assert(orders.length === 0 && customers.length === 0,
      "signOutAndLockDashboard clears all sensitive in-memory orders and customers");
    assert(localStorage.getItem(STORAGE_ORDERS) === null && localStorage.getItem(STORAGE_CUSTOMERS) === null,
      "signOutAndLockDashboard wipes cached orders and customers from localStorage");
    assert((document.getElementById('ordersTableBody')?.innerHTML || '') === '',
      "signOutAndLockDashboard clears ordersTableBody DOM");
  } finally {
    resetAuthFailureCounters();
    setFirebaseAuthForTest(null);
    setAdminAuthForTest(false);
    setRealtimeDbForTest(snap23Db);
    resetRealtimeListenerHandlesForTest();
    if (typeof document !== 'undefined' && document.body) {
      document.body.classList.remove('auth-locked');
    }
    customers = snap23Customers;
    orders = snap23Orders;
    updateDashboard();
  }

  // ==========================================
  // TEST 24: Spark Free Plan Quota Safety & Config Write Deduplication
  // ==========================================
  log("\n--- TEST 24: Spark Free Plan Quota Safety & Config Write Deduplication ---");
  const snap24Db = getRealtimeDbForTest();
  let appConfigWrites24 = 0;
  let deliveryConfigWrites24 = 0;
  let fullOrdersGets24 = 0;
  let fullCustomersGets24 = 0;
  try {
    setAdminAuthForTest(true, 'admin@thirdman.test');
    const mock24Db = {
      settings: () => {},
      disableNetwork: () => Promise.resolve(),
      enableNetwork: () => Promise.resolve(),
      batch: () => ({ set: () => {}, update: () => {}, delete: () => {}, commit: () => Promise.resolve() }),
      collection: (name) => ({
        doc: (docId) => ({
          set: () => {
            if (name === 'settings' && docId === 'app_config') appConfigWrites24++;
            if (name === 'settings' && docId === 'delivery_config') deliveryConfigWrites24++;
            return Promise.resolve();
          },
          update: () => Promise.resolve(),
          onSnapshot: (onNext) => {
            onNext({ exists: false, data: () => null });
            return () => {};
          },
          get: () => Promise.resolve({ exists: false, data: () => null })
        }),
        where: () => ({
          get: () => Promise.resolve(makeMockSnap([]))
        }),
        onSnapshot: (onNext) => {
          onNext(makeMockSnap([]));
          return () => {};
        },
        get: () => {
          if (name === 'orders') fullOrdersGets24++;
          if (name === 'customers') fullCustomersGets24++;
          return Promise.resolve(makeMockSnap([]));
        }
      })
    };

    setRealtimeDbForTest(mock24Db);
    resetRealtimeListenerHandlesForTest();

    // 1. initFirebaseSync must NOT fire redundant full collection get() alongside onSnapshot
    initFirebaseSync();
    assert(fullOrdersGets24 === 0 && fullCustomersGets24 === 0,
      "initFirebaseSync attaches live onSnapshot listeners without duplicate full orders/customers get() reads");

    // 2. syncCloudConfig hashes payload and skips identical redundant writes
    appConfigWrites24 = 0;
    deliveryConfigWrites24 = 0;
    syncCloudConfig(true);
    syncCloudConfig(true);
    syncCloudConfig(true);
    assert(appConfigWrites24 === 1,
      "Repeated unchanged syncCloudConfig(true) calls perform only 1 Firestore write (zero redundant writes)");
    assert(deliveryConfigWrites24 === 1,
      "Repeated unchanged syncDeliverySafeConfigToCloud calls perform only 1 Firestore write");

    // Updating a config list triggers exactly 1 new write on next sync
    const origAreas24 = Array.isArray(savedAreas) ? [...savedAreas] : [];
    savedAreas = Array.from(new Set([...origAreas24, 'QuotaTestTown_' + Date.now()]));
    syncCloudConfig(true);
    assert(appConfigWrites24 === 2, "Genuine config mutation triggers 1 incremental Firestore config update");
    savedAreas = origAreas24;
    syncCloudConfig(true);

    // 3. Quota exhaustion ('resource-exhausted') pauses automatic retries cleanly
    assert(isFirestoreQuotaPaused() === false, "Quota pause is initially inactive");
    const quotaHandled = handleFirestoreListenerError({ code: 'resource-exhausted', message: 'Quota exceeded' }, 'test_quota');
    assert(quotaHandled === true && isFirestoreQuotaPaused() === true,
      "resource-exhausted error triggers quota pause window instead of tight retry loop");
  } finally {
    setAdminAuthForTest(false);
    setRealtimeDbForTest(snap24Db);
    resetRealtimeListenerHandlesForTest();
  }

  log(`\n================================`);
  log(`TEST RESULTS: ${passed} PASSED, ${failed} FAILED`);
  if (failed === 0) {
    log("🎉 ALL TESTS PASSED SUCCESSFULLY!");
  }
})();
</script>
