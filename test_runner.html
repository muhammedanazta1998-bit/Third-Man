<script>
(function runTests() {
  const log = (msg) => {
    document.getElementById('output').innerHTML += "\n" + msg;
    console.log(msg);
  };

  document.getElementById('output').innerHTML = "=== RUNNING TESTS ===";

  let passed = 0;
  let failed = 0;

  function assert(condition, message) {
    if (condition) {
      log("✓ PASS: " + message);
      passed++;
    } else {
      log("✗ FAIL: " + message);
      failed++;
    }
  }

  // TEST 1: Canonical product resolution for all aliases
  const testCases = [
    { in: 'MOHABBATH', expectedId: 'prod_mg', expectedName: 'Mohabbath Green' },
    { in: 'mohabbath green', expectedId: 'prod_mg', expectedName: 'Mohabbath Green' },
    { in: 'DOUBLE CHABI WHITE SELLA', expectedId: 'prod_dcw', expectedName: 'White Chabi' },
    { in: 'DC White', expectedId: 'prod_dcw', expectedName: 'White Chabi' },
    { in: 'White Chabi', expectedId: 'prod_dcw', expectedName: 'White Chabi' },
    { in: 'DOUBLE CHABI GOLD SELLA', expectedId: 'prod_dcg', expectedName: 'Golden Chabi' },
    { in: 'DC Gold', expectedId: 'prod_dcg', expectedName: 'Golden Chabi' },
    { in: 'Golden Chabi', expectedId: 'prod_dcg', expectedName: 'Golden Chabi' },
    { in: 'SM 3ROSE 2ND', expectedId: 'prod_jmt', expectedName: 'JMT Rose 2nd' },
    { in: 'JMT Rose 2nd', expectedId: 'prod_jmt', expectedName: 'JMT Rose 2nd' },
    { in: 'JASMINE', expectedId: 'prod_jas', expectedName: 'Jasmine' },
    { in: 'JOKER', expectedId: 'prod_joker', expectedName: 'Joker' },
    { in: 'DAAWAT XXXL GOLD SELLA', expectedId: 'prod_daawat', expectedName: 'Daawat XXXL Gold Sella' },
    { in: 'ROYAL GOLD', expectedId: 'prod_royalgold', expectedName: 'Royal Gold' },
    { in: 'ROYAL WHITE', expectedId: 'prod_royalwhite', expectedName: 'Royal White' }
  ];

  testCases.forEach(tc => {
    const res = getCanonicalProduct(tc.in);
    assert(res && res.id === tc.expectedId && res.name === tc.expectedName,
      `getCanonicalProduct('${tc.in}') => id: ${tc.expectedId}, name: '${tc.expectedName}'`);
  });

  // TEST 2: Deduplication with noisy input containing all duplicate variants
  const noisyProducts = [
    { id: 'p_1', name: 'MOHABBATH', category: 'Kaima', bagSize: 26, defaultRateKg: 98 },
    { id: 'prod_mg', name: 'Mohabbath Green', category: 'Kaima', bagSize: 26, defaultRateKg: 98, imageUrl: 'data:image/svg+xml;base64,AAA' },
    { id: 'p_2', name: 'DOUBLE CHABI WHITE SELLA', category: 'Basmati', bagSize: 30, defaultRateKg: 90 },
    { id: 'prod_dcw', name: 'DC White', category: 'Basmati', bagSize: 30, defaultRateKg: 90 },
    { id: 'p_3', name: 'White Chabi', category: 'Basmati', bagSize: 30, defaultRateKg: 90 },
    { id: 'p_4', name: 'DOUBLE CHABI GOLD SELLA', category: 'Basmati', bagSize: 30, defaultRateKg: 92 },
    { id: 'prod_dcg', name: 'DC Gold', category: 'Basmati', bagSize: 30, defaultRateKg: 92 },
    { id: 'p_5', name: 'SM 3ROSE 2ND', category: 'Other', bagSize: 26, defaultRateKg: 88 },
    { id: 'prod_jmt', name: 'JMT Rose 2nd', category: 'Other', bagSize: 26, defaultRateKg: 88 },
    { id: 'p_demo', name: 'Wayanadan Kaima Rice', category: 'Kaima', bagSize: 26 }, // Demo sample
    { id: 'p_agg', name: 'Mohabbath Green (+2 more)', category: 'Kaima' } // Aggregate order text
  ];

  const cleaned = deduplicateProductsList(noisyProducts, false);

  assert(cleaned.length >= 6, `Cleaned products count is at least 6 (actual: ${cleaned.length})`);
  
  // Verify no duplicate names exist
  const namesSet = new Set();
  let hasDuplicateName = false;
  cleaned.forEach(p => {
    const low = p.name.toLowerCase();
    if (namesSet.has(low)) hasDuplicateName = true;
    namesSet.add(low);
  });
  assert(!hasDuplicateName, "Zero duplicate product names in cleaned catalog");

  // Verify demo sample and aggregate text were purged
  const hasDemo = cleaned.some(p => p.name.includes('Wayanadan') || p.name.includes('more)'));
  assert(!hasDemo, "Demo sample and aggregate text purged from catalog");

  // Verify image was preserved during merge
  const mgProd = cleaned.find(p => p.id === 'prod_mg');
  assert(mgProd && mgProd.imageUrl === 'data:image/svg+xml;base64,AAA', "Custom product image preserved during deduplication merge");

  // TEST 3: Customer alias mapping
  const testCustomers = [
    { id: 'c1', name: 'MAJ', town: 'Angamaly' },
    { id: 'c2', name: 'MAJ Angamaly', town: 'Ernakulam' },
    { id: 'c3', name: 'PKBR ELAMAKKARA', town: 'Ernakulam' },
    { id: 'c4', name: 'Al-Safi Food Court, Pukkattupady', town: 'Ernakulam' },
    { id: 'c5', name: 'EDAKKATTU BAZAAR', town: 'Ernakulam' },
    { id: 'c6', name: 'Edakkat Basmati', town: 'Ernakulam' },
    { id: 'c7', name: 'Edakkat Enterprises Bypass', town: 'Ernakulam' },
    { id: 'c8', name: 'MAK Aluva', town: 'Aluva' },
    { id: 'c9', name: 'MK Aluva', town: 'Aluva' },
    { id: 'c10', name: 'Marwa Aluva', town: 'Aluva' },
    { id: 'c11', name: 'Southern Aluva', town: 'Aluva' },
    { id: 'c12', name: 'ALUVA TRADING COMPANY', town: 'Aluva' }
  ];

  const dedupedCust = deduplicateCustomersList(testCustomers, false);

  // MAJ Angamaly should merge into MAJ
  const majMatches = dedupedCust.filter(c => c.name.toLowerCase().includes('maj'));
  assert(majMatches.length === 1 && majMatches[0].name === 'MAJ', `MAJ Angamaly merged into single 'MAJ' (actual: ${majMatches.map(c=>c.name).join(', ')})`);

  // PKBR ELAMAKKARA should be normalized to PKBR
  const pkbrMatches = dedupedCust.filter(c => c.name.toLowerCase().includes('pkbr'));
  assert(pkbrMatches.length === 1 && pkbrMatches[0].name === 'PKBR', `PKBR ELAMAKKARA normalized to 'PKBR' (actual: ${pkbrMatches.map(c=>c.name).join(', ')})`);

  // Al-Safi Food Court, Pukkattupady should be normalized to Al-Safi Food Court
  const safiMatches = dedupedCust.filter(c => c.name.toLowerCase().includes('safi'));
  assert(safiMatches.length === 1 && safiMatches[0].name === 'Al-Safi Food Court', `Al-Safi Food Court, Pukkattupady normalized to 'Al-Safi Food Court'`);

  // TEST 4: Riyas and Riyas Traders deduplication
  const riyasTestCustomers = [
    { id: 'c_manual', name: 'Riyas', phone: '9847111222', town: 'Ernakulam' },
    { id: 'c_hist_062', name: 'Riyas Traders', town: 'Ernakulam', category: 'Wholesaler' }
  ];
  const dedupedRiyas = deduplicateCustomersList(riyasTestCustomers, false);
  const riyasMatches = dedupedRiyas.filter(c => c.name.toLowerCase().includes('riyas'));
  assert(riyasMatches.length === 1 && riyasMatches[0].name === 'Riyas Traders', `'Riyas' merged into single 'Riyas Traders' (actual: ${riyasMatches.map(c=>c.name).join(', ')})`);
  assert(riyasMatches[0].phone === '9847111222', "Phone number preserved on merged Riyas Traders");

  // TEST 5: Pre-November customer catalog integrity
  assert(typeof PRE_NOVEMBER_CANONICAL_CUSTOMERS !== 'undefined', "PRE_NOVEMBER_CANONICAL_CUSTOMERS is defined");
  assert(PRE_NOVEMBER_CANONICAL_CUSTOMERS.length === 69, `PRE_NOVEMBER_CANONICAL_CUSTOMERS has exactly 69 customers (actual: ${PRE_NOVEMBER_CANONICAL_CUSTOMERS.length})`);
  assert(PRE_NOVEMBER_CANONICAL_CUSTOMERS.some(c => c.name === 'Riyas Traders'), "'Riyas Traders' is present in pre-November customers");
  assert(!PRE_NOVEMBER_CANONICAL_CUSTOMERS.some(c => c.name === 'Riyas'), "'Riyas' alone is NOT present in pre-November customers");

  // Edakkat group: all 3 must remain separate
  assert(dedupedCust.some(c => c.name === 'EDAKKATTU BAZAAR'), "EDAKKATTU BAZAAR preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'Edakkat Basmati'), "Edakkat Basmati preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'Edakkat Enterprises Bypass'), "Edakkat Enterprises Bypass preserved as separate customer");

  // Aluva group: all 5 must remain separate
  assert(dedupedCust.some(c => c.name === 'MAK Aluva'), "MAK Aluva preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'MK Aluva'), "MK Aluva preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'Marwa Aluva'), "Marwa Aluva preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'Southern Aluva'), "Southern Aluva preserved as separate customer");
  assert(dedupedCust.some(c => c.name === 'ALUVA TRADING COMPANY'), "ALUVA TRADING COMPANY preserved as separate customer");

  // TEST 6: Product update persistence (bag size and rate customization)
  const testProdCatalog = [
    { id: 'prod_mg', name: 'Mohabbath Green', category: 'Kaima', bagSize: 26, defaultRateKg: 98, active: true },
    { id: 'prod_jas', name: 'Jasmine', category: 'Basmati', bagSize: 30, defaultRateKg: 112, active: true }
  ];
  // User customizes bagSize to 50 and rate to 115
  testProdCatalog[0].bagSize = 50;
  testProdCatalog[0].defaultRateKg = 115;
  testProdCatalog[0].isCustomized = true;
  testProdCatalog[0].updatedAt = Date.now();

  const dedupedUpdated = deduplicateProductsList(testProdCatalog, false);
  const mgAfterDedup = dedupedUpdated.find(p => p.id === 'prod_mg');
  assert(mgAfterDedup && mgAfterDedup.bagSize === 50, "Product bagSize 50kg strictly preserved after deduplication (no revert to 26)");
  assert(mgAfterDedup && mgAfterDedup.defaultRateKg === 115, "Product defaultRateKg 115 strictly preserved after deduplication");

  // Also test merging with stale cloud copy (simulating Firestore snapshot)
  const staleCloud = [
    { id: 'prod_mg', name: 'Mohabbath Green', category: 'Kaima', bagSize: 26, defaultRateKg: 98, active: true }
  ];
  const cloudMerged = deduplicateProductsList([...dedupedUpdated, ...staleCloud], false);
  const mgAfterCloud = cloudMerged.find(p => p.id === 'prod_mg');
  assert(mgAfterCloud && mgAfterCloud.bagSize === 50, "Product bagSize 50kg preserved after cloud snapshot merge");
  assert(mgAfterCloud && mgAfterCloud.defaultRateKg === 115, "Product defaultRateKg 115 preserved after cloud snapshot merge");

  // TEST 7: Previous orders protection (changing product bagSize/rate NEVER affects past orders)
  const pastOrders = [
    {
      id: 'TM-HIST-101',
      date: '2026-07-10',
      customer: { id: 'c_001', name: 'Riyas Traders' },
      items: [
        {
          productId: 'prod_mg',
          productName: 'Mohabbath Green',
          bagSize: 26,
          bagQty: 10,
          perKgRate: 98,
          totalKg: 260,
          totalAmount: 25480
        }
      ],
      product: { id: 'prod_mg', name: 'Mohabbath Green' },
      bagSize: 26,
      bagQty: 10,
      totalKg: 260,
      perKgRate: 98,
      totalAmount: 25480
    }
  ];
  orders = pastOrders;

  // Run cascadeProductUpdateToOrders with the updated product (bagSize: 50, rate: 115)
  cascadeProductUpdateToOrders('prod_mg', 'Mohabbath Green', mgAfterCloud);

  assert(orders[0].items[0].bagSize === 26, "Past order item bagSize remains frozen at 26kg");
  assert(orders[0].items[0].perKgRate === 98, "Past order item perKgRate remains frozen at ₹98/kg");
  assert(orders[0].items[0].totalKg === 260, "Past order item totalKg remains frozen at 260kg");
  assert(orders[0].items[0].totalAmount === 25480, "Past order item totalAmount remains frozen at ₹25,480");
  assert(orders[0].bagSize === 26, "Past order level bagSize remains frozen at 26kg");
  assert(orders[0].totalKg === 260, "Past order level totalKg remains frozen at 260kg");
  assert(orders[0].totalAmount === 25480, "Past order level totalAmount remains frozen at ₹25,480");

  // Also run cascadeCanonicalProductsToOrders
  cascadeCanonicalProductsToOrders();
  assert(orders[0].items[0].bagSize === 26, "After cascadeCanonicalProductsToOrders, past bagSize still 26kg");
  assert(orders[0].items[0].totalAmount === 25480, "After cascadeCanonicalProductsToOrders, past totalAmount still ₹25,480");

  // TEST 8: Customer Team Member Cross-Device Cloud Sync
  const baseCust = {
    id: 'c_hist_025',
    name: 'Riyas Traders',
    category: 'Wholesaler',
    town: 'Ernakulam',
    district: 'Ernakulam',
    members: [
      { id: 'm_owner_1', name: 'Riyas', role: 'Owner', phone: '9847111222', isPrimary: true }
    ]
  };
  customers = [baseCust];

  // 1. Simulate adding a member locally (computer)
  const newMember = {
    id: 'm_staff_cook_99',
    name: 'Usthad Shafi',
    role: 'Chef / Cook',
    phone: '9847333444',
    isPrimary: false
  };
  baseCust.members.push(newMember);
  syncCustomerMemberLegacyFields(baseCust);

  assert(baseCust.members.length === 2, "Local customer has 2 members after adding Usthad Shafi");
  assert(baseCust.staffName === 'Usthad Shafi', "syncCustomerMemberLegacyFields updated staffName to 'Usthad Shafi'");

  // 2. Simulate mobile receiving cloud snapshot containing baseCust with the new member
  const incomingRemote = [
    {
      id: 'c_hist_025',
      name: 'Riyas Traders',
      category: 'Wholesaler',
      town: 'Ernakulam',
      district: 'Ernakulam',
      members: [
        { id: 'm_owner_1', name: 'Riyas', role: 'Owner', phone: '9847111222', isPrimary: true },
        { id: 'm_staff_cook_99', name: 'Usthad Shafi', role: 'Chef / Cook', phone: '9847333444', isPrimary: false }
      ]

  assert(cadenceOverdue.badgeText === 'Overdue by 3d', `Badge text shows 'Overdue by 3d' (actual: '${cadenceOverdue.badgeText}')`);

  // Tier A (7d): Visited 6 days ago -> due in 1d (Due Soon)
  const testShopDueSoon = { id: 'test_s5', name: 'Test Shop Due Soon', tier: 'A', lastVisitedDate: '2026-11-18' };
  const cadenceDueSoon = getShopCadenceInfo(testShopDueSoon, '2026-11-24');
  assert(cadenceDueSoon.status === 'due_soon', "Tier A visited 6 days ago is 'due_soon'");
  assert(cadenceDueSoon.daysRemaining === 1, "Due in 1 day");

  // Tier B (14d): Visited 4 days ago -> due in 10d (On Track)
  const testShopOnTrack = { id: 'test_s6', name: 'Test Shop On Track', tier: 'B', lastVisitedDate: '2026-11-20' };
  const cadenceOnTrack = getShopCadenceInfo(testShopOnTrack, '2026-11-24');
  assert(cadenceOnTrack.status === 'on_track', "Tier B visited 4 days ago is 'on_track'");
  assert(cadenceOnTrack.daysRemaining === 10, "Due in 10 days");

  // Tier D (30d cadence)
  const testShopTierD = { id: 'test_s7', name: 'Test Shop D', tier: 'D', lastVisitedDate: '2026-11-01' };
  const cadenceD = getShopCadenceInfo(testShopTierD, '2026-11-24');
  assert(cadenceD.intervalDays === 30, "Tier D has 30 days interval");

  // 2. Quick "+ Add Shop" & Prospect Support
  const initialCustCount = customers.length;
  const prospectShop = {
    id: 'test_prospect_' + Date.now(),
    name: 'Aluva Grand Traders Lead',
    town: 'Aluva',
    phone: '9846011111',
    tier: 'A',
    isProspect: true,
    lastVisitedDate: null,
    visitCount: 0
  };
  customers.push(prospectShop);
  assert(customers.length === initialCustCount + 1, "Prospect shop added to customers list");
  assert(prospectShop.isProspect === true, "New lead is marked as isProspect = true");

  // 3. Auto-Upgrade Prospect to Customer upon Order
  upgradeProspectToCustomerIfOrdered('Aluva Grand Traders Lead');
  assert(prospectShop.isProspect === false, "Prospect automatically upgraded to Customer (isProspect = false) when order is recorded");

  // 4. Mark Visit (Check-in) & Backdated Date Support
  selectDailyReportDate('2026-11-24');
  const visitsBefore = dailyVisits.length;
  markQuickShopVisit(prospectShop.id, 'Order Taken', 'Booked 50 bags Biriyani Rice');
  assert(dailyVisits.length === visitsBefore + 1, "New visit record added to dailyVisits");
  assert(prospectShop.lastVisitedDate === '2026-11-24', "Shop lastVisitedDate updated to visit date");
  assert(prospectShop.visitCount >= 1, "Shop visitCount incremented");

  const recordedVisit = dailyVisits.find(v => v.shopId === prospectShop.id && v.date === '2026-11-24');
  assert(recordedVisit !== undefined, "Visit record found with correct shopId and date");
  assert(recordedVisit.tag === 'Order Taken', `Visit tag correctly saved as 'Order Taken' (actual: '${recordedVisit.tag}')`);

  // 5. Backdated Visit Test: Friday, 21st (2026-11-21)
  selectDailyReportDate('2026-11-21');
  assert(dailyReportSelectedDate === '2026-11-21', "Selected date successfully set to backdated Friday Nov 21");
  const testBackdatedShop = {
    id: 'test_backdated_s1',
    name: 'Kalamassery Supermarket',
    town: 'Kalamassery',
    phone: '9846099999',
    tier: 'B',
    isProspect: false,
    lastVisitedDate: null,
    visitCount: 0
  };
  customers.push(testBackdatedShop);
  markQuickShopVisit(testBackdatedShop.id, 'Payment Collected', 'Collected invoice payment');
  const backdatedVisit = dailyVisits.find(v => v.shopId === testBackdatedShop.id && standardizeDateString(v.date) === '2026-11-21');
  assert(backdatedVisit !== undefined, "Backdated visit for Friday, Nov 21st correctly saved in dailyVisits with standardized date");
  assert(backdatedVisit.date === '2026-11-21', "Backdated visit date strictly formatted as '2026-11-21'");

  // Test standardizeDateString across various Firestore/JS formats
  assert(standardizeDateString('2026-11-21T14:30:00.000Z') === '2026-11-21', "standardizeDateString parses ISO string to '2026-11-21'");
  assert(standardizeDateString('21-11-2026') === '2026-11-21', "standardizeDateString parses DD-MM-YYYY to '2026-11-21'");
  const mockTimestamp = { toDate: () => new Date('2026-11-21T12:00:00') };
  assert(standardizeDateString(mockTimestamp) === '2026-11-21', "standardizeDateString parses Firestore Timestamp object to '2026-11-21'");

  // Test mergeIncomingCloudVisits with backdated remote visits
  const mockRemoteVisits = [
    { id: 'v_remote_1', shopId: 'test_backdated_s1', shopName: 'Kalamassery Supermarket', date: '2026-11-21T08:00:00.000Z' }
  ];
  mergeIncomingCloudVisits(mockRemoteVisits);
  const foundMerged = dailyVisits.find(v => v.id === 'v_remote_1');
  assert(foundMerged !== undefined && foundMerged.date === '2026-11-21', "mergeIncomingCloudVisits successfully syncs and standardizes backdated remote visits");

  // Zero Data Loss Guarantee: Incoming empty array [] must NEVER wipe local visits!
  const visitsCountBeforeEmptyMerge = dailyVisits.length;
  assert(visitsCountBeforeEmptyMerge > 0, "Visits exist prior to empty remote snapshot test");
  mergeIncomingCloudVisits([]);
  assert(dailyVisits.length === visitsCountBeforeEmptyMerge, `Zero data loss verified: empty snapshot preserved all ${visitsCountBeforeEmptyMerge} visits (actual: ${dailyVisits.length})`);

  // Visit Tombstone Guarantee: Deleted visit must be tombstoned and not revived by remote snapshot
  const testTombstoneVisit = {
    id: 'v_tombstone_test_1',
    shopId: 'shop_tombstone_test',
    shopName: 'Temporary Shop',
    date: '2026-11-21'
  };
  dailyVisits.push(testTombstoneVisit);
  saveDailyReportDataToStorage();
  assert(dailyVisits.some(v => v.id === 'v_tombstone_test_1'), "Test visit added for tombstone check");
  addVisitTombstone('v_tombstone_test_1');
  assert(isVisitTombstoned('v_tombstone_test_1') === true, "Visit ID successfully registered in deleted visit tombstones");

  // Try to revive it via remote snapshot
  mergeIncomingCloudVisits([testTombstoneVisit]);
  assert(!dailyVisits.some(v => v.id === 'v_tombstone_test_1'), "Tombstoned visit was properly ignored and not revived by remote sync");
  removeVisitTombstone('v_tombstone_test_1');

  // 6. Dedicated Visited Section Rendering Test
  selectDailyReportDate('2026-11-21');
  renderDailyReportVisitedSection();
  const visitedSectionEl = document.getElementById('dailyReportVisitedSection');
  const visitedSectionListEl = document.getElementById('visitedSectionList');
  const visitedCountBadgeEl = document.getElementById('visitedSectionCountBadge');
  assert(visitedSectionEl !== null && !visitedSectionEl.classList.contains('hidden'), "Dedicated Visited Section unhidden when visits exist for Nov 21");
  assert(visitedSectionListEl !== null && visitedSectionListEl.children.length > 0, "Visited Section contains rendered shop cards");
  assert(visitedCountBadgeEl !== null && visitedCountBadgeEl.textContent.includes('Visited'), "Visited count badge renders '✓ [N] Visited'");

  // 7. Calendar Tile Indicator Display Test
  dailyReportCalendarYear = 2026;
  dailyReportCalendarMonth = 10; // November (0-based: 10 = Nov)
  renderDailyReportCalendar();
  const calContainer = document.getElementById('dailyReportCalendarContainer');
  assert(calContainer !== null && calContainer.innerHTML.length > 0, "Calendar days rendered in container");
  assert(calContainer.innerHTML.includes('✓') && (calContainer.innerHTML.includes('Visited') || calContainer.innerHTML.includes('Sent')), "Calendar day tile shows checkmark and visit count / status");

  // 8. Leave / Holiday Tracking
  dailyReports['2026-11-25'] = {
    id: '2026-11-25',
    date: '2026-11-25',
    status: 'leave',
    reason: 'Personal Leave'
  };
  saveDailyReportDataToStorage();
  assert(dailyReports['2026-11-25'] && dailyReports['2026-11-25'].status === 'leave', "2026-11-25 marked as Leave");

  // 7. WhatsApp Report Minimal Format Verification (Date + Shop Names ONLY — strictly no area/location/parentheses)
  selectDailyReportDate('2026-11-24');
  const dayVisits = dailyVisits.filter(v => standardizeDateString(v.date) === '2026-11-24');
  assert(dayVisits.length > 0, "Visits exist for WhatsApp export");
  let exportOutput = `*Date: 24-11-2026*\n`;
  dayVisits.forEach((v, idx) => {
    exportOutput += `${idx + 1}. ${(v.shopName || 'Shop').trim()}\n`;
  });
  exportOutput = exportOutput.trim();
  assert(exportOutput.startsWith('*Date: 24-11-2026*'), "WhatsApp report starts with exact '*Date: DD-MM-YYYY*'");
  assert(exportOutput.includes('1. Aluva Grand Traders Lead'), "Report contains clean numbered list with shop name ONLY");
  assert(!exportOutput.includes('(Aluva)') && !exportOutput.includes('('), "Report strictly removes town, area, and location in parentheses");
  assert(!exportOutput.includes('Turnover') && !exportOutput.includes('Total Bags'), "WhatsApp report has zero clutter or stats");

  // ==========================================
  // TEST 15: Live Delivery Updates Popover Alignment & Compact Sizing
  // ==========================================
  log("\n--- TEST 15: Live Delivery Updates Notification Popover ---");

  const dropdownEl = document.getElementById('deliveryAlertDropdown');
  const alertListEl = document.getElementById('deliveryAlertList');
  assert(dropdownEl !== null, "Delivery alert dropdown fixture exists in DOM");
  assert(dropdownEl.classList.contains('hidden'), "Delivery alert dropdown starts hidden by default");

  // Open menu
  toggleDeliveryAlertMenu();
  assert(!dropdownEl.classList.contains('hidden'), "toggleDeliveryAlertMenu() reveals the dropdown panel");

  // Record a delivery event
  recordDeliveryEvent({
    id: 'ORD-7701',
    customer: 'Royal Supermarket',
    deliveryNote: 'Handed over to manager • Cash collected',
    deliveredAt: new Date().toISOString()
  });

  renderDeliveryAlertList();
  const alertItem = alertListEl.querySelector('.delivery-alert-item');
  assert(alertItem !== null, "renderDeliveryAlertList renders .delivery-alert-item element");
  const custEl = alertListEl.querySelector('.delivery-alert-customer');
  assert(custEl !== null && custEl.textContent.includes('Royal Supermarket'), "Customer name 'Royal Supermarket' rendered cleanly with .delivery-alert-customer");
  const orderIdEl = alertListEl.querySelector('.delivery-alert-orderid');
  assert(orderIdEl !== null && orderIdEl.textContent.includes('ORD-7701'), "Order ID 'ORD-7701' rendered with .delivery-alert-orderid");

  // Close menu
  closeDeliveryAlertMenu();
  assert(dropdownEl.classList.contains('hidden'), "closeDeliveryAlertMenu() successfully hides the dropdown");

  // Clear history
  clearDeliveryAlertHistory();
  const historyAfterClear = getDeliveredHistory();
  assert(historyAfterClear.length === 0, "clearDeliveryAlertHistory() cleans up history store");

  // ==========================================
  // TEST 16: Customer Directory Standardized Filter & Search Controls
  // ==========================================
  log("\n--- TEST 16: Customer Directory Standardized Filter & Search Controls ---");

  const custFiltersPanel = document.getElementById('custFiltersPanel');
  const custFiltersChevron = document.getElementById('custFiltersChevron');
  const custActiveFiltersBadge = document.getElementById('custActiveFiltersBadge');
  const btnToggleCustFilters = document.getElementById('btnToggleCustFilters');
  const btnResetCustFilters = document.getElementById('btnResetCustFilters');
  const custSearchInput = document.getElementById('custDirectorySearchInput');
  const btnCustSearchClear = document.getElementById('btnCustSearchClear');

  assert(custFiltersPanel !== null, "Customer filters panel fixture exists in DOM");
  assert(custFiltersPanel.classList.contains('hidden'), "Customer filters panel starts collapsed/hidden by default");

  // 1. Toggle filter panel
  toggleCustomerFiltersPanel();
  assert(!custFiltersPanel.classList.contains('hidden'), "toggleCustomerFiltersPanel() expands the filters panel");
  assert(custFiltersChevron.style.transform === 'rotate(180deg)', "Chevron rotates 180deg when filters panel expands");

  toggleCustomerFiltersPanel();
  assert(custFiltersPanel.classList.contains('hidden'), "toggleCustomerFiltersPanel() collapses the filters panel back");
  assert(custFiltersChevron.style.transform === 'rotate(0deg)', "Chevron rotates 0deg when filters panel collapses");

  // 2. Active filter count badge
  setCustomerDistrictFilter('Ernakulam');
  assert(customerDistrictFilter === 'Ernakulam', "District filter successfully set to 'Ernakulam'");
  assert(!custActiveFiltersBadge.classList.contains('hidden'), "Active filter count badge is shown when district filter is active");
  assert(custActiveFiltersBadge.textContent === '1', "Active filter badge shows '1' when 1 filter is active");

  setCustomerCategoryFilter('Caterer');
  assert(customerCategoryFilter === 'Caterer', "Category filter successfully set to 'Caterer'");
  assert(custActiveFiltersBadge.textContent === '2', "Active filter badge shows '2' when district + category are active");
  assert(!btnResetCustFilters.classList.contains('hidden'), "Reset filters button is visible when filters are active");

  // 3. Search clear button
  custSearchInput.value = 'Basmati';
  renderCustomersList();
  assert(!btnCustSearchClear.classList.contains('hidden'), "Search clear '✕' button is visible when search input has text");

  clearCustomerSearch();
  assert(custSearchInput.value === '', "clearCustomerSearch() successfully empties search input");
  assert(btnCustSearchClear.classList.contains('hidden'), "Search clear '✕' button is hidden after clearing search");

  // 4. Reset all customer filters
  resetCustomerFilters();
  assert(customerDistrictFilter === 'all', "resetCustomerFilters() resets district filter to 'all'");
  assert(customerTownFilter === 'all', "resetCustomerFilters() resets town filter to 'all'");
  assert(customerCategoryFilter === 'all', "resetCustomerFilters() resets category filter to 'all'");
  assert(custActiveFiltersBadge.classList.contains('hidden'), "Active filter badge is hidden after reset");
  assert(btnResetCustFilters.classList.contains('hidden'), "Reset filters button is hidden after reset");

  // ==========================================
  // TEST 17: Streamlined Navigation & Settings Incentive Hub
  // ==========================================
  log("\n--- TEST 17: Streamlined Navigation & Settings Incentive Hub ---");

  // 1. Primary mobile bottom navigation buttons
  const tabHome = document.getElementById('tabBtnHome');
  const tabOrders = document.getElementById('tabBtnOrders');
  const tabDailyReport = document.getElementById('tabBtnDailyReport');
  const tabCustomers = document.getElementById('tabBtnCustomers');
  const tabMore = document.getElementById('tabBtnMore');
  const tabIncentives = document.getElementById('tabBtnIncentives');

  assert(tabHome !== null, "tabBtnHome exists in primary bottom navigation");
  assert(tabOrders !== null, "tabBtnOrders exists in primary bottom navigation");
  assert(tabDailyReport !== null, "tabBtnDailyReport exists in primary bottom navigation");
  assert(tabCustomers !== null, "tabBtnCustomers exists in primary bottom navigation");
  assert(tabMore !== null, "tabBtnMore exists in primary bottom navigation");
  assert(tabIncentives === null, "tabBtnIncentives removed from primary bottom navigation");

  // 2. Bottom nav clicks & active tab state
  handleBottomNavClick('home');
  assert(currentMainView === 'overview', "handleBottomNavClick('home') switches to overview");
  assert(activeMobileTab === 'home', "activeMobileTab is 'home'");

  handleBottomNavClick('orders');
  assert(currentMainView === 'sales-register', "handleBottomNavClick('orders') switches to sales-register");
  assert(activeMobileTab === 'orders', "activeMobileTab is 'orders'");

  handleBottomNavClick('daily-report');
  assert(currentMainView === 'daily-report', "handleBottomNavClick('daily-report') switches to daily-report");
  assert(activeMobileTab === 'dailyReport', "activeMobileTab is 'dailyReport'");

  handleBottomNavClick('customers');
  assert(currentMainView === 'customers', "handleBottomNavClick('customers') switches to customers");
  assert(activeMobileTab === 'customers', "activeMobileTab is 'customers'");

  // 3. Routing from incentives to Settings -> Incentive Scheme & Rules
  switchMainView('incentives');
  assert(currentMainView === 'settings', "switchMainView('incentives') smoothly routes to 'settings'");
  assert(currentSettingsTab === 'incentive', "currentSettingsTab is 'incentive'");

  showIncentiveDetails();
  assert(currentMainView === 'settings', "showIncentiveDetails() routes to 'settings'");
  assert(currentSettingsTab === 'incentive', "showIncentiveDetails() opens the 'incentive' tab inside settings");

  handleBottomNavClick('incentives');
  assert(currentMainView === 'settings', "handleBottomNavClick('incentives') routes to 'settings'");
  assert(currentSettingsTab === 'incentive', "handleBottomNavClick('incentives') activates the 'incentive' subTab");

  // ==========================================
  // TEST 18: Overview Dashboard Decluttering
  // ==========================================
  log("\n--- TEST 18: Overview Dashboard Decluttering ---");
  const viewOverviewEl = document.getElementById('viewOverview');
  assert(viewOverviewEl !== null, "viewOverview fixture exists in DOM");
  assert(viewOverviewEl.querySelector('.bg-gradient-to-r.from-blue-900\\/90') === null, "Redundant Quick Sales Register banner is removed from Overview");
  assert(document.getElementById('testFixtures').querySelector('footer') === null, "Outdated footer banner is not in overview fixtures");

  // ==========================================
  // TEST 19: Support Chat & Helpline System
  // ==========================================
  log("\n--- TEST 19: Support Chat & Helpline System ---");
  const btnSupportChat = document.getElementById('btnSupportChat');
  const supportChatDropdown = document.getElementById('supportChatDropdown');
  const supportChatUnreadBadge = document.getElementById('supportChatUnreadBadge');
  const adminSupportMessageList = document.getElementById('adminSupportMessageList');
  const adminSupportReplyInput = document.getElementById('adminSupportReplyInput');

  assert(btnSupportChat !== null, "btnSupportChat exists in DOM");
  assert(supportChatDropdown !== null, "supportChatDropdown exists in DOM");
  assert(supportChatDropdown.classList.contains('hidden'), "supportChatDropdown starts closed");

  // 1. Menu open, close and toggle
  openSupportChatMenu();
  assert(!supportChatDropdown.classList.contains('hidden'), "openSupportChatMenu() opens the support chat panel");
  closeSupportChatMenu();
  assert(supportChatDropdown.classList.contains('hidden'), "closeSupportChatMenu() closes the support chat panel");
  toggleSupportChatMenu();
  assert(!supportChatDropdown.classList.contains('hidden'), "toggleSupportChatMenu() opens panel when closed");
  toggleSupportChatMenu();
  assert(supportChatDropdown.classList.contains('hidden'), "toggleSupportChatMenu() closes panel when open");

  // 2. Unread badge calculation
  const mockChatList = [
    {
      id: 'mock-chat-1',
      sender: 'delivery',
      senderName: 'Rider Anil',
      tag: 'Bug',
      text: 'Cannot complete delivery #5468, app is spinning',
      timestamp: new Date().toISOString(),
      readByAdmin: false,
      readByDelivery: true
    },
    {
      id: 'mock-chat-2',
      sender: 'delivery',
      senderName: 'Driver Biju',
      tag: 'Delivery Issue',
      text: 'Shop owner not available at PKBR',
      timestamp: new Date().toISOString(),
      readByAdmin: false,
      readByDelivery: true
    }
  ];
  setSupportChatMessages(mockChatList);
  updateSupportChatUnreadBadge();
  assert(!supportChatUnreadBadge.classList.contains('hidden'), "supportChatUnreadBadge is visible with unread messages");
  assert(supportChatUnreadBadge.textContent === '2', "supportChatUnreadBadge count equals 2");

  // 3. Message rendering
  renderAdminSupportMessages();
  assert(adminSupportMessageList.innerHTML.includes('Rider Anil'), "adminSupportMessageList renders sender name");
  assert(adminSupportMessageList.innerHTML.includes('🐞 Bug'), "adminSupportMessageList renders bug tag badge");
  assert(adminSupportMessageList.innerHTML.includes('Cannot complete delivery #5468'), "adminSupportMessageList renders message text");

  // 4. Mark messages as read
  markAdminMessagesAsRead();
  const currentMessages = getSupportChatMessages();
  assert(currentMessages.every(m => m.readByAdmin === true), "All delivery messages marked readByAdmin: true");
  assert(supportChatUnreadBadge.classList.contains('hidden'), "Unread badge is hidden after marking messages as read");

  // 5. Send Admin reply
  adminSupportReplyInput.value = 'Checking now, hold on';
  sendAdminSupportReply();
  assert(adminSupportReplyInput.value === '', "sendAdminSupportReply clears the reply input");
  const adminMsg = getSupportChatMessages().find(m => m.sender === 'admin');
  assert(adminMsg !== undefined, "Admin reply is appended to supportChatMessages");
  assert(adminMsg.text === 'Checking now, hold on', "Admin message content is accurate");
  assert(adminMsg.readByDelivery === false, "Admin message has readByDelivery: false");

  // 6. Clear / Resolve Support Chat
  const origConfirm = window.confirm;
  window.confirm = () => true;
  clearOrResolveSupportChat();
  window.confirm = origConfirm;
  assert(getSupportChatMessages().length === 0, "clearOrResolveSupportChat clears all messages");
  assert(document.getElementById('adminSupportEmptyState') !== null, "Empty state displayed after clearing messages");

  // 7. Click / Propagation & Portal Backdrop Regression Checks
  const supportChatBackdrop = document.getElementById('supportChatBackdrop');
  assert(supportChatBackdrop !== null, "supportChatBackdrop portal fixture exists");
  setSupportChatMessages([
    {
      id: 'reg-ts-2',
      sender: 'delivery',
      senderName: 'Rider One',
      tag: 'Help',
      text: 'Later message via seconds',
      timestamp: { seconds: 1795580000 },
      readByAdmin: false,
      readByDelivery: true
    },
    {
      id: 'reg-ts-1',
      sender: 'delivery',
      senderName: 'Rider Two',
      tag: 'Bug',
      text: 'Earlier message via createdAt',
      createdAt: new Date(1795570000 * 1000).toISOString(),
      readByAdmin: false,
      readByDelivery: true
    }
  ]);
  const sortedMsgs = getSupportChatMessages();
  assert(sortedMsgs[0].id === 'reg-ts-1' && sortedMsgs[1].id === 'reg-ts-2', "Mixed timestamp/createdAt messages sort chronologically");

  updateSupportChatUnreadBadge();
  assert(supportChatUnreadBadge.textContent === '2', "Unread badge updates to 2 for mixed-timestamp unread messages");

  // Simulate direct click on button (as dispatched by browser tap)
  closeSupportChatMenu();
  btnSupportChat.click();
  assert(!supportChatDropdown.classList.contains('hidden'), "btnSupportChat.click() cleanly opens supportChatDropdown");
  assert(!supportChatBackdrop.classList.contains('hidden'), "supportChatBackdrop becomes visible when menu opens");

  // Click inside message list does NOT close chat dropdown
  adminSupportMessageList.click();
  assert(!supportChatDropdown.classList.contains('hidden'), "Clicking inside supportChatDropdown keeps panel open");

  // Clicking backdrop closes both dropdown and backdrop
  supportChatBackdrop.click();
  assert(supportChatDropdown.classList.contains('hidden'), "Clicking backdrop closes supportChatDropdown");
  assert(supportChatBackdrop.classList.contains('hidden'), "Clicking backdrop hides supportChatBackdrop");

  // Clean up test messages
  window.confirm = () => true;
  clearOrResolveSupportChat();
  window.confirm = origConfirm;

  log(`\n================================`);
  log(`TEST RESULTS: ${passed} PASSED, ${failed} FAILED`);
  if (failed === 0) {
    log("🎉 ALL TESTS PASSED SUCCESSFULLY!");
  }
})();
</script>
