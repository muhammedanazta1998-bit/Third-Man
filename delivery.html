<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Third Man Delivery">
  <meta name="theme-color" content="#0f172a">
  <title>Third Man - Staff Delivery & Dispatch Portal</title>
  <link rel="manifest" href="manifest.json">
  <link id="deliveryAppleTouchIcon" rel="apple-touch-icon" href="apple-touch-icon.png">
  <link id="deliveryAppleTouchIcon180" rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <script>
    window.EMBEDDED_DEFAULT_LOGO_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
      <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e3a8a"/>
          <stop offset="100%" stop-color="#09111e"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fbbf24"/>
          <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
          <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
      </defs>
      <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
      <g fill="url(#goldGrad)" opacity="0.95">
        <ellipse cx="44" cy="70" rx="7" ry="13" transform="rotate(-35 44 70)"/>
        <ellipse cx="36" cy="95" rx="7" ry="13" transform="rotate(-20 36 95)"/>
        <ellipse cx="38" cy="122" rx="7" ry="13" transform="rotate(10 38 122)"/>
        <ellipse cx="50" cy="146" rx="7" ry="12" transform="rotate(35 50 146)"/>
      </g>
      <g fill="url(#goldGrad)" opacity="0.95">
        <ellipse cx="156" cy="70" rx="7" ry="13" transform="rotate(35 156 70)"/>
        <ellipse cx="164" cy="95" rx="7" ry="13" transform="rotate(20 164 95)"/>
        <ellipse cx="162" cy="122" rx="7" ry="13" transform="rotate(-10 162 122)"/>
        <ellipse cx="150" cy="146" rx="7" ry="12" transform="rotate(-35 150 146)"/>
      </g>
      <circle cx="100" cy="95" r="45" fill="#0b1324" stroke="url(#cyanGrad)" stroke-width="2.5"/>
      <path d="M86 58 L100 44 L114 58 L107 63 L100 56 L93 63 Z" fill="url(#goldGrad)"/>
      <text x="100" y="107" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">TM</text>
      <rect x="28" y="152" width="144" height="26" rx="13" fill="url(#goldGrad)"/>
      <text x="100" y="169" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#09111e" text-anchor="middle" letter-spacing="1.5">THIRD MAN</text>
    </svg>`);

    (function() {
      try {
        var customLogo = localStorage.getItem('thirdman_app_logo');
        if (customLogo && !customLogo.startsWith('data:') && !customLogo.endsWith('.svg') && !customLogo.includes('.svg') && !customLogo.includes('image/svg+xml')) {
          var atIcons = document.querySelectorAll('link[rel="apple-touch-icon"], link[rel="apple-touch-icon-precomposed"]');
          atIcons.forEach(function(link) {
            link.href = customLogo;
          });
        }
      } catch (e) {}
    })();
  </script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    @media (max-width: 768px) {
      input, select, textarea {
        font-size: 16px !important;
      }
      button, a, input, select, textarea {
        touch-action: manipulation;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-100 text-slate-800">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 min-w-0">
        <img id="deliveryHeaderLogo" src="uploaded-logo.png" onerror="if(this.src.indexOf('uploaded-logo.png')!==-1){this.src='logo.svg';}else if(window.EMBEDDED_DEFAULT_LOGO_SVG){this.src=window.EMBEDDED_DEFAULT_LOGO_SVG;}" alt="Third Man Logo" class="w-10 h-10 rounded-xl shrink-0 shadow-md object-contain bg-slate-900 p-0.5">
        <script>
          (function() {
            try {
              var customLogo = localStorage.getItem('thirdman_app_logo');
              var img = document.getElementById('deliveryHeaderLogo');
              if (img && customLogo) {
                img.src = customLogo;
              }
            } catch(e) {}
          })();
        </script>
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="font-black text-sm sm:text-base tracking-tight text-white truncate">THIRD MAN</h1>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-blue-500/20 text-blue-300 border border-blue-400/30">Delivery Portal</span>
          </div>
          <p class="text-[11px] text-slate-400 truncate">Staff Dispatch &amp; Delivery Management</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <!-- Live Cloud Sync Status -->
        <div id="syncBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-slate-800 border border-slate-700 text-[11px] font-semibold text-slate-300 shadow-inner">
          <span id="syncDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="syncText">Connecting...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-7xl mx-auto w-full px-3 sm:px-4 py-4 flex-1 space-y-3.5 pb-20">

    <!-- SEARCH & FILTER CONTROLS -->
    <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200/80 shadow-xs space-y-3">
      
      <!-- Search Input & View Mode Switcher -->
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="deliverySearchInput" oninput="onSearchChange()" placeholder="Search customer, shop name, town, order ID..." class="w-full text-xs sm:text-sm pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition">
        </div>

        <!-- View Mode Switcher & Edit Remarks Button -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" onclick="openManageRemarksModal()" title="Edit Selection Remarks" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 transition flex items-center gap-1.5 active:scale-95 shadow-2xs">
            <i data-lucide="edit-3" class="w-3.5 h-3.5 text-blue-600"></i>
            <span class="hidden sm:inline">Edit Remarks</span>
          </button>
          <div class="flex items-center gap-0.5 bg-slate-100 p-1 rounded-xl border border-slate-200">
            <button type="button" id="btnViewCards" onclick="setViewMode('cards')" title="Cards Grid View" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-white text-slate-900 shadow-2xs">
              <i data-lucide="layout-grid" class="w-3.5 h-3.5 text-blue-600"></i>
              <span class="hidden sm:inline">Cards</span>
            </button>
            <button type="button" id="btnViewTable" onclick="setViewMode('table')" title="Compact Desktop Table View" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-600 hover:text-slate-900">
              <i data-lucide="table" class="w-3.5 h-3.5 text-indigo-600"></i>
              <span class="hidden sm:inline">Compact Table</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Filter Tabs: Pending (Default) vs Delivered vs All -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1">
        <button type="button" id="tabBtnPending" onclick="switchDeliveryTab('pending')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-blue-600 text-white shadow-sm">
          <i data-lucide="clock" class="w-3.5 h-3.5"></i>
          <span>Pending Deliveries</span>
          <span id="badgePendingCount" class="ml-1 px-1.5 py-0.2 bg-white/20 text-white text-[10px] font-black rounded-full">0</span>
        </button>
        <button type="button" id="tabBtnDelivered" onclick="switchDeliveryTab('delivered_today')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-600"></i>
          <span>Delivered Today</span>
          <span id="badgeDeliveredCount" class="ml-1 px-1.5 py-0.2 bg-emerald-100 text-emerald-800 text-[10px] font-black rounded-full">0</span>
        </button>
        <button type="button" id="tabBtnAll" onclick="switchDeliveryTab('all')" class="py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">
          <i data-lucide="list" class="w-3.5 h-3.5"></i>
          <span>All (<span id="badgeAllCount">0</span>)</span>
        </button>
      </div>

      <!-- Quick Town & Urgency Dropdowns -->
      <div class="flex items-center gap-2 text-xs">
        <div class="flex-1">
          <select id="townFilterSelect" onchange="onTownFilterChange(this.value)" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-700 focus:bg-white">
            <option value="all">🏙️ All Towns</option>
          </select>
        </div>
        <div class="shrink-0">
          <select id="urgencyFilterSelect" onchange="onUrgencyFilterChange(this.value)" class="p-2 bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-700 focus:bg-white">
            <option value="all">⚡ All Priorities</option>
            <option value="Urgent">🔥 Urgent Only</option>
            <option value="Normal">🚚 Normal</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Live Dispatch Stats Bar: Total Orders, Total Bags, Total Weight (KG) -->
    <div id="dispatchStatsBanner" class="bg-gradient-to-r from-blue-900 to-indigo-950 text-white p-3.5 sm:p-4 rounded-2xl shadow-md flex items-center justify-between gap-3 border border-blue-800/40">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center shrink-0 border border-white/10">
          <i data-lucide="scale" class="w-5 h-5 text-cyan-300"></i>
        </div>
        <div>
          <span class="text-[10px] font-bold text-cyan-300 uppercase tracking-wider block" id="dispatchStatsTitle">Pending Load Summary</span>
          <div class="flex items-center gap-2 text-xs sm:text-sm font-black text-white">
            <span id="statFilteredOrdersCount">0 Orders</span>
            <span class="text-white/40">•</span>
            <span id="statFilteredBagsCount" class="text-amber-300">0 Bags</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2.5">
        <button type="button" id="btnMarkAllPendingDelivered" onclick="markAllPendingDelivered()" class="hidden px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold rounded-xl transition shadow-sm active:scale-95 flex items-center gap-1">
          <i data-lucide="check-check" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Mark All Delivered</span>
          <span class="sm:hidden">Deliver All</span>
        </button>
        <div class="text-right">
          <span class="text-[10px] font-bold text-slate-300 uppercase tracking-wider block">Total Load Weight</span>
          <span id="statFilteredKgCount" class="text-base sm:text-lg font-black text-white">0 <span class="text-xs text-cyan-300 font-bold">kg</span></span>
        </div>
      </div>
    </div>

    <!-- ORDERS LIST CONTAINER -->
    <div id="ordersListContainer" class="space-y-3">
      <!-- Loading Skeleton -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 text-center space-y-3">
        <div class="w-8 h-8 rounded-full border-2 border-blue-600 border-t-transparent animate-spin mx-auto"></div>
        <p class="text-xs text-slate-500 font-bold">Loading orders from cloud...</p>
      </div>
    </div>

  </main>

  <!-- CONFIRM DELIVERY & NOTE MODAL -->
  <div id="deliveryActionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-3 sm:p-5 hidden">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg border border-slate-200 overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
            <i data-lucide="check-circle" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="font-extrabold text-sm text-white" id="modalActionTitle">Confirm Delivery</h3>
            <p class="text-[11px] text-slate-400" id="modalCustomerSubtitle">Customer Name</p>
          </div>
        </div>
        <button type="button" onclick="closeDeliveryActionModal()" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white flex items-center justify-center">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="p-4 sm:p-5 space-y-4">
        <!-- Quick Remark Chips -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider">Quick Delivery Remarks:</label>
            <button type="button" onclick="openManageRemarksModal()" class="text-[11px] text-blue-600 hover:text-blue-800 font-bold flex items-center gap-1 hover:underline active:scale-95 transition">
              <i data-lucide="edit-3" class="w-3 h-3 text-blue-600"></i>
              <span>Edit Remarks</span>
            </button>
          </div>
          <div id="quickRemarksContainer" class="flex flex-wrap gap-1.5">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- Custom Notes Textarea -->
        <div>
          <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Staff Delivery Remarks / Vehicle Details:</label>
          <textarea id="modalDeliveryNoteInput" rows="3" placeholder="e.g. Delivered 35 bags to Chef Moideen, driver Ramesh vehicle KL-07-CB-4560..." class="w-full text-xs sm:text-sm p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition"></textarea>
        </div>

        <!-- Action Button -->
        <div class="flex items-center gap-2 pt-2">
          <button type="button" onclick="closeDeliveryActionModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition">
            Cancel
          </button>
          <button type="button" id="btnConfirmSubmit" onclick="submitDeliveryAction()" class="flex-2 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl text-xs transition shadow-md shadow-emerald-600/30 flex items-center justify-center gap-1.5 active:scale-95">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span id="btnConfirmSubmitText">Mark as Delivered</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MANAGE SELECTION REMARKS MODAL -->
  <div id="manageRemarksModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-3 sm:p-5 hidden">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md border border-slate-200 overflow-hidden animate-in fade-in zoom-in-95 duration-150 flex flex-col max-h-[90vh]">
      <!-- Modal Header -->
      <div class="bg-slate-900 text-white p-4 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center">
            <i data-lucide="edit-3" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="font-extrabold text-sm text-white">Edit Selection Remarks</h3>
            <p class="text-[11px] text-slate-400">Manage Quick Delivery Remarks Presets</p>
          </div>
        </div>
        <button type="button" onclick="closeManageRemarksModal()" class="w-7 h-7 rounded-lg text-slate-400 hover:text-white flex items-center justify-center">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-4 sm:p-5 space-y-4 overflow-y-auto flex-1">
        <!-- Add New Remark Form -->
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
          <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider">Add New Quick Remark:</label>
          <div class="flex gap-2">
            <input type="text" id="newRemarkTextInput" placeholder="e.g. 📦 Left at Security / Gate" class="flex-1 text-xs p-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition" onkeydown="if(event.key==='Enter'){event.preventDefault();addNewQuickRemark();}">
            <button type="button" onclick="addNewQuickRemark()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl transition shadow-xs active:scale-95 shrink-0 flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Add</span>
            </button>
          </div>
        </div>

        <!-- Remarks List -->
        <div>
          <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-2">Current Selection Remarks (<span id="manageRemarksCount">0</span>):</label>
          <div id="manageRemarksList" class="space-y-2">
            <!-- Dynamically populated list of remark inputs with delete buttons -->
          </div>
        </div>

        <!-- Reset Button -->
        <div class="pt-2 flex justify-between items-center border-t border-slate-100">
          <button type="button" onclick="resetQuickRemarksToDefault()" class="text-xs text-rose-600 hover:text-rose-700 font-bold flex items-center gap-1 hover:underline">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            <span>Reset to Defaults</span>
          </button>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="p-4 bg-slate-50 border-t border-slate-200 flex items-center gap-2 shrink-0">
        <button type="button" onclick="closeManageRemarksModal()" class="flex-1 py-2.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold rounded-xl text-xs transition">
          Cancel
        </button>
        <button type="button" onclick="saveQuickRemarksFromManageModal()" class="flex-2 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl text-xs transition shadow-sm active:scale-95 flex items-center justify-center gap-1.5">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Save Changes</span>
        </button>
      </div>
    </div>
  </div>

  <!-- FLOATING TOAST NOTIFICATION -->
  <div id="toastNotification" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold border border-slate-800 flex items-center gap-2 transition-all transform translate-y-20 opacity-0 pointer-events-none">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMessage">Action completed</span>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDvU5PL0rINxwGwyZlpvdY6el0dLbz4UYY",
      authDomain: "third-man-1998.firebaseapp.com",
      projectId: "third-man-1998",
      storageBucket: "third-man-1998.firebasestorage.app",
      messagingSenderId: "928547046358",
      appId: "1:928547046358:web:723643e5a083a81f66da77"
    };

    const STORAGE_ORDERS = 'biriyani_rice_orders_fresh_v2';
    const STORAGE_DELIVERY_CACHE = 'third_man_delivery_orders_cache';

    let db = null;
    let allOrders = [];
    let currentTab = 'pending'; // 'pending', 'delivered_today', 'all'
    let searchQuery = '';
    let selectedTown = 'all';
    let selectedUrgency = 'all';
    let activeActionOrderId = null;
    let activeActionType = 'delivered'; // 'delivered' or 'note_only'
    let currentViewMode = localStorage.getItem('deliveryViewMode') || (window.innerWidth >= 1024 ? 'table' : 'cards');

    function sortOrders(arr) {
      if (!Array.isArray(arr)) return;
      arr.sort((a, b) => {
        const aUrg = (a.deliveryStatus === 'Urgent') ? 1 : 0;
        const bUrg = (b.deliveryStatus === 'Urgent') ? 1 : 0;
        if (bUrg !== aUrg) return bUrg - aUrg;
        return (b.date || '').localeCompare(a.date || '') || (b.id || '').localeCompare(a.id || '');
      });
    }

    function normalizeHistoricalOrders(list) {
      if (!Array.isArray(list)) return [];
      const needsSync = [];
      const nowIso = new Date().toISOString();
      list.forEach(o => {
        if (!o) return;
        // Business rule: All orders placed on or before 2026-11-21 are DELIVERED
        if (!o.dispatchStatus || (o.date && o.date <= '2026-11-21' && o.dispatchStatus !== 'Delivered')) {
          o.dispatchStatus = 'Delivered';
          o.deliveredAt = o.deliveredAt || (o.date ? (o.date + 'T18:00:00.000Z') : '2026-11-21T14:30:00.000Z');
          needsSync.push(o);
        }
        // Normalize customer alias (e.g. 'Thanima' -> 'Thanima Hotel')
        const curName = (typeof o.customer === 'object' ? (o.customer?.name || '') : String(o.customer || '')).trim();
        const curLower = curName.toLowerCase();
        if (curLower === 'thanima' || curLower === 'hotel thanima') {
          if (typeof o.customer === 'object') o.customer.name = 'Thanima Hotel';
          else o.customer = 'Thanima Hotel';
          o.customerName = 'Thanima Hotel';
          needsSync.push(o);
        }
      });
      return needsSync;
    }

    function syncOrdersDispatchStatusToFirestore(orderList) {
      if (!db || !Array.isArray(orderList) || orderList.length === 0) return;
      const CHUNK_SIZE = 400;
      for (let i = 0; i < orderList.length; i += CHUNK_SIZE) {
        const chunk = orderList.slice(i, i + CHUNK_SIZE);
        try {
          const batch = db.batch();
          chunk.forEach(o => {
            if (o && o.id) {
              const ref = db.collection('orders').doc(o.id);
              batch.set(ref, {
                dispatchStatus: 'Delivered',
                deliveredAt: o.deliveredAt || new Date().toISOString()
              }, { merge: true });
            }
          });
          batch.commit().catch(err => console.warn('Delivery batch mark notice:', err));
        } catch (e) {
          console.warn('Batch write error:', e);
        }
      }
    }

            normalizeHistoricalOrders(parsed);
            allOrders = parsed;

            populateTownDropdown();
            updateTabBadges();

    function initFirebase() {
      // 1. Instantly display orders from local cache if available (0ms load time!)
      const hasCached = loadInitialOrdersFromCache();

      if (typeof firebase === 'undefined') {
        console.warn('Firebase SDK not defined.');
        updateSyncStatus('error', 'Offline');
        if (!hasCached) {
          showEmptyOrErrorState('Firebase library could not be loaded from CDN. Please check internet connection.');
        }
        return;
      }

      try {
        if (!firebase.apps || !firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        db = firebase.firestore();

        db.enablePersistence({ synchronizeTabs: true }).catch(err => {
          console.warn('Persistence mode notice:', err ? err.code : 'disabled');
        });

        updateSyncStatus('syncing', 'Connecting Cloud...');

        // 2. Start realtime listener
        listenToOrders();

        // 3. Concurrently trigger direct get() fetch so we don't depend solely on onSnapshot stream
        fetchOrdersDirect();
        syncQuickRemarksFromCloud();
        syncLogoFromCloud();

        // 4. REST fallback after 2.5 seconds if cloud connection is lagging
        setTimeout(() => {
          if (allOrders.length === 0) {
            fetchOrdersFromRestFallback();
          }
        }, 2500);

        // 5. Timeout watchdog: If after 6 seconds still 0 orders, show retry UI
        setTimeout(() => {
          if (allOrders.length === 0) {
            showEmptyOrErrorState('Connecting to cloud is taking longer than usual.');
          }
        }, 6000);

      } catch (e) {
        console.error('Firebase init error in delivery portal:', e);
        fetchOrdersFromRestFallback();
        updateSyncStatus('error', 'Connection Error');
        if (allOrders.length === 0) {
          showEmptyOrErrorState('Connection Error: ' + e.message);
        }
      }
    }

    function processIncomingOrdersSnapshot(snapshot) {
      if (!snapshot) return;
      const loaded = [];
      snapshot.forEach(doc => {
        const d = doc.data();
        if (d && d.id) {
          loaded.push(d);
        }
      });

      const needsCloudSync = normalizeHistoricalOrders(loaded);
      sortOrders(loaded);
      allOrders = loaded;

      try {
        localStorage.setItem(STORAGE_DELIVERY_CACHE, JSON.stringify(loaded));
      } catch (e) {}

      if (needsCloudSync.length > 0 && db) {
        syncOrdersDispatchStatusToFirestore(needsCloudSync);
      }

      updateSyncStatus('synced', 'Live Synced 🟢');
      populateTownDropdown();
      updateTabBadges();
      renderOrders();
    }

    function listenToOrders() {
      if (!db) return;
      db.collection('orders').onSnapshot(snapshot => {
        processIncomingOrdersSnapshot(snapshot);
      }, err => {
        console.warn('Orders onSnapshot error:', err);
        fetchOrdersFromRestFallback();
        updateSyncStatus('error', 'Offline');
        if (allOrders.length === 0) {
          showEmptyOrErrorState('Could not load orders: ' + (err.message || 'Network error'));
        }
      });
    }

    function fetchOrdersDirect() {
      if (!db) {
        fetchOrdersFromRestFallback();
        return;
      }
      db.collection('orders').get().then(snapshot => {
        if (!snapshot.empty) {
          processIncomingOrdersSnapshot(snapshot);
        } else if (allOrders.length === 0) {
          allOrders = [];
          updateSyncStatus('synced', 'Live Synced (0 Orders)');
          populateTownDropdown();
          updateTabBadges();
          renderOrders();
        }
      }).catch(err => {
        console.warn('Direct get orders notice:', err);
        fetchOrdersFromRestFallback();
      });
    }

    async function fetchOrdersFromRestFallback() {
      if (allOrders.length > 0) return;
      try {
        const resp = await fetch('https://firestore.googleapis.com/v1/projects/third-man-1998/databases/(default)/documents/orders?pageSize=300');
        if (!resp.ok) return;
        const json = await resp.json();
        if (!json || !Array.isArray(json.documents) || json.documents.length === 0) return;

        function parseRestVal(v) {
          if (!v) return null;
          if (v.stringValue !== undefined) return v.stringValue;
          if (v.integerValue !== undefined) return parseInt(v.integerValue, 10);
          if (v.doubleValue !== undefined) return parseFloat(v.doubleValue);
          if (v.booleanValue !== undefined) return v.booleanValue;
          if (v.nullValue !== undefined) return null;
          if (v.timestampValue !== undefined) return v.timestampValue;
          if (v.arrayValue !== undefined) {
            return (v.arrayValue.values || []).map(parseRestVal);
          }
          if (v.mapValue !== undefined) {
            const m = {};
            const fields = v.mapValue.fields || {};
            for (const k in fields) {
              m[k] = parseRestVal(fields[k]);
            }
            return m;
          }
          return null;
        }

        const restOrders = json.documents.map(doc => {
          const fields = doc.fields || {};
          const obj = {};
          for (const k in fields) {
            obj[k] = parseRestVal(fields[k]);
          }
          return obj;
        }).filter(o => o && o.id);

        if (restOrders.length > 0 && allOrders.length === 0) {
          normalizeHistoricalOrders(restOrders);
          sortOrders(restOrders);
          allOrders = restOrders;
          try {
            localStorage.setItem(STORAGE_DELIVERY_CACHE, JSON.stringify(restOrders));
          } catch (e) {}
          updateSyncStatus('synced', 'Live Synced 🟢');
          populateTownDropdown();
          updateTabBadges();
          renderOrders();
        }
      } catch (err) {
        console.warn('REST fallback fetch notice:', err);
      }
    }

    function renderOrderTableRow(o) {
      const isUrgent = (o.deliveryStatus === 'Urgent');
      const isDelivered = (o.dispatchStatus === 'Delivered');

      const items = (Array.isArray(o.items) && o.items.length > 0) ? o.items : [

      ];

      const totalBags = (o.bagQty !== undefined) ? o.bagQty : items.reduce((s, it) => s + (parseFloat(it.bagQty) || 0), 0);

        ? parseFloat(o.totalKg)
        : items.reduce((s, it) => s + ((parseFloat(it.bagQty) || 0) * (parseFloat(it.bagSize) || 25)), 0);
      const totalOrderAmount = (o.totalAmount !== undefined && o.totalAmount !== null)
        ? parseFloat(o.totalAmount)
        : items.reduce((s, it) => {
            const itKg = parseFloat(it.totalKg) || ((parseFloat(it.bagQty) || 0) * (parseFloat(it.bagSize) || 25));
            return s + (itKg * (parseFloat(it.perKgRate) || 0));
          }, 0);

      const custName = getCustName(o);
      const custTown = getCustTown(o);
      const custLandmark = getCustLandmark(o);
      const custPhone = getCustPhone(o);
      const cleanPhone = custPhone.replace(/\D/g, '');
      const displayLocation = custLandmark || custTown;

      // Priority pill
      const urgencyPill = isUrgent
        ? `<span class="px-2 py-0.5 bg-rose-100 text-rose-800 border border-rose-300 rounded-md text-[9px] font-black inline-flex items-center gap-0.5">🔥 URGENT</span>`
        : `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md text-[9px] font-bold">🚚 NORMAL</span>`;

      // Status pill
      let statusPill = `<span class="px-2 py-0.5 bg-amber-50 text-amber-800 border border-amber-300 rounded-md text-[9px] font-bold inline-flex items-center gap-1">⏳ PENDING</span>`;
      if (isDelivered) {
        statusPill = `<span class="px-2 py-0.5 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-md text-[9px] font-extrabold inline-flex items-center gap-1">✅ DELIVERED</span>`;
      } else if (isOut) {
        statusPill = `<span class="px-2 py-0.5 bg-blue-50 text-blue-800 border border-blue-300 rounded-md text-[9px] font-bold inline-flex items-center gap-1">🚚 OUT FOR DELIVERY</span>`;
      }

      return `
        <tr class="hover:bg-slate-50 transition border-b border-slate-100 ${isDelivered ? 'bg-emerald-50/20' : (isUrgent ? 'bg-rose-50/30' : '')}">
          <td class="py-2.5 px-3 whitespace-nowrap">
            <div class="font-mono font-black text-blue-700 text-xs">${escapeHtml(o.id)}</div>
            <div class="text-[10px] text-slate-500 font-medium">${escapeHtml(o.date || '')}</div>
            <div class="mt-0.5">${urgencyPill}</div>
          </td>
          <td class="py-2.5 px-3">
            <div class="font-black text-slate-900 text-xs sm:text-sm tracking-tight">${escapeHtml(custName)}</div>
            <div class="flex items-center gap-1.5 mt-0.5 flex-wrap">
              ${displayLocation ? `<span class="text-[10px] font-bold text-blue-800 bg-blue-50 px-1.5 py-0.2 rounded border border-blue-200" title="Landmark: ${escapeHtml(custLandmark || 'None')} • Town: ${escapeHtml(custTown || 'None')}">📍 ${escapeHtml(displayLocation)}</span>` : ''}
              ${cleanPhone ? `<a href="tel:${cleanPhone}" class="text-[10px] font-bold text-emerald-700 hover:underline inline-flex items-center gap-0.5">📞 ${escapeHtml(cleanPhone)}</a>` : ''}
            </div>
          </td>
          <td class="py-2.5 px-3">
            <div class="space-y-0.5 text-xs">
              ${items.map(it => {
                const bQty = parseFloat(it.bagQty) || 0;
                const bSize = parseFloat(it.bagSize) || 25;
                const itKg = parseFloat(it.totalKg) || (bQty * bSize);
                const itRate = parseFloat(it.perKgRate) || 0;
                return `
                  <div class="flex items-center gap-1.5 font-semibold text-slate-800 flex-wrap">
                    <span class="text-amber-600">🌾</span>
                    <span class="font-bold">${escapeHtml(it.productName || 'Rice')}:</span>
                    <span class="text-blue-900 font-black">${bQty} Bags</span>
                    <span class="text-[10px] text-slate-500">(${itKg}kg)</span>
                    <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.2 rounded border border-emerald-200">₹${itRate}/kg</span>
                  </div>
                `;
              }).join('')}
            </div>
          </td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap">
            <div class="font-black text-slate-900 text-xs">${totalBags} Bags</div>
            <div class="text-[11px] font-extrabold text-blue-950">${totalWeightKg.toLocaleString('en-IN')} <span class="text-[10px] text-slate-500 font-normal">kg</span></div>
          </td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap">
            <div class="font-black text-emerald-700 text-sm">₹${Math.round(totalOrderAmount).toLocaleString('en-IN')}</div>
          </td>
          <td class="py-2.5 px-3">
            <div class="mb-1">${statusPill}</div>
            ${o.deliveryNote ? `
              <div class="text-[11px] font-medium text-emerald-950 bg-emerald-50/95 px-2 py-1 rounded-lg border border-emerald-200 max-w-[260px] break-words mt-1 leading-snug shadow-2xs" title="${escapeHtml(o.deliveryNote)}">
                <span class="font-extrabold text-emerald-800">🚚 Remarks:</span> ${escapeHtml(o.deliveryNote)}
                ${o.deliveredAt ? `<div class="text-[9px] text-emerald-700 font-semibold mt-0.5">⏰ ${formatTime(o.deliveredAt)}</div>` : ''}
              </div>
            ` : ''}
            ${o.notes ? `
              <div class="text-[10px] text-amber-900 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200 max-w-[200px] truncate mt-0.5" title="${escapeHtml(o.notes)}">
                📝 ${escapeHtml(o.notes)}
              </div>
            ` : ''}
          </td>
          <td class="py-2.5 px-3 text-center whitespace-nowrap">
            <div class="flex items-center justify-center gap-1">
              ${!isDelivered ? `
                ${!isOut ? `
                  <button type="button" onclick="setOutForDelivery('${o.id}')" title="Out for Delivery" class="p-1.5 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 transition">
                    <i data-lucide="truck" class="w-4 h-4"></i>
                  </button>
                ` : ''}
                <button type="button" onclick="openDeliveryActionModal('${o.id}', 'delivered')" title="Mark as Delivered" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs transition shadow-2xs flex items-center gap-1">
                  <i data-lucide="check" class="w-3.5 h-3.5"></i>
                  <span>Deliver</span>
                </button>
              ` : `
                <button type="button" onclick="revertToPending('${o.id}')" title="Revert" class="px-2 py-1 text-[10px] text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-lg">
                  Revert
                </button>
              `}
              <button type="button" onclick="openDeliveryActionModal('${o.id}', 'note_only')" title="Edit Note" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 transition">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    }

    function renderOrderCard(o) {
      const isUrgent = (o.deliveryStatus === 'Urgent');
      const isDelivered = (o.dispatchStatus === 'Delivered');
      const isOut = (o.dispatchStatus === 'OutForDelivery');

      const items = (Array.isArray(o.items) && o.items.length > 0) ? o.items : [
        { productName: (o.product && o.product.name) || o.productName || 'Biriyani Rice', bagQty: o.bagQty || 0, bagSize: o.bagSize || 25 }
      ];

      const totalBags = (o.bagQty !== undefined) ? o.bagQty : items.reduce((s, it) => s + (parseFloat(it.bagQty) || 0), 0);
      const totalWeightKg = (o.totalKg !== undefined && o.totalKg !== null)
        ? parseFloat(o.totalKg)
        : items.reduce((s, it) => s + ((parseFloat(it.bagQty) || 0) * (parseFloat(it.bagSize) || 25)), 0);
      const totalOrderAmount = (o.totalAmount !== undefined && o.totalAmount !== null)
        ? parseFloat(o.totalAmount)
        : items.reduce((s, it) => {
            const itKg = parseFloat(it.totalKg) || ((parseFloat(it.bagQty) || 0) * (parseFloat(it.bagSize) || 25));
            return s + (itKg * (parseFloat(it.perKgRate) || 0));
          }, 0);

      const custName = getCustName(o);
      const custTown = getCustTown(o);
      const custLandmark = getCustLandmark(o);
      const custPhone = getCustPhone(o);
      const cleanPhone = custPhone.replace(/\D/g, '');
      const displayLocation = custLandmark || custTown;

      // Priority pill
      const urgencyPill = isUrgent
        ? `<span class="px-2.5 py-1 bg-rose-500/10 text-rose-700 border border-rose-300 rounded-full text-[10px] font-black inline-flex items-center gap-1 shadow-2xs animate-pulse">🔥 URGENT DELIVERY</span>`
        : `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full text-[10px] font-bold">🚚 NORMAL</span>`;

      // Status pill
      let statusPill = `<span class="px-2.5 py-1 bg-amber-50 text-amber-800 border border-amber-300 rounded-full text-[10px] font-bold inline-flex items-center gap-1">⏳ PENDING</span>`;
      if (isDelivered) {
        statusPill = `<span class="px-2.5 py-1 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-full text-[10px] font-extrabold inline-flex items-center gap-1">✅ DELIVERED</span>`;
      } else if (isOut) {
        statusPill = `<span class="px-2.5 py-1 bg-blue-50 text-blue-800 border border-blue-300 rounded-full text-[10px] font-bold inline-flex items-center gap-1">🚚 OUT FOR DELIVERY</span>`;
      }

      // Border and background highlighting
      let cardBorder = isDelivered ? 'border-emerald-200 bg-white' : (isUrgent ? 'border-rose-300 ring-2 ring-rose-200/50 bg-white' : 'border-slate-200 bg-white');

      return `
        <div class="rounded-2xl sm:rounded-3xl border ${cardBorder} p-4 sm:p-5 shadow-xs transition-all space-y-3.5">
          
          <!-- Card Top Bar: ID, Date, Priority, Status -->
          <div class="flex items-center justify-between gap-2 pb-2.5 border-b border-slate-100 flex-wrap">
            <div class="flex items-center gap-2">
              <span class="font-mono font-black text-blue-700 text-xs sm:text-sm">${escapeHtml(o.id)}</span>
              <span class="text-slate-300">•</span>
              <span class="text-xs font-medium text-slate-500">📅 ${escapeHtml(o.date || '')}</span>
            </div>
            <div class="flex items-center gap-1.5">
              ${urgencyPill}
              ${statusPill}
            </div>
          </div>

          <!-- Customer Shop Name & Landmark / Location -->
          <div class="space-y-1">
            <h2 class="font-black text-base sm:text-lg text-slate-900 tracking-tight leading-tight">${escapeHtml(custName)}</h2>
            <div class="flex items-center gap-1.5 flex-wrap text-xs text-slate-600">
              ${displayLocation ? `<span class="inline-flex items-center gap-1 font-bold bg-blue-50 text-blue-800 px-2 py-0.5 rounded-lg border border-blue-200/60" title="Landmark: ${escapeHtml(custLandmark || 'None')} • Town: ${escapeHtml(custTown || 'None')}">📍 ${escapeHtml(displayLocation)}</span>` : ''}
              ${cleanPhone ? `
                <a href="tel:${cleanPhone}" class="inline-flex items-center gap-1 font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-2 py-0.5 rounded-lg transition active:scale-95">
                  <i data-lucide="phone" class="w-3 h-3 text-emerald-600"></i>
                  <span>${escapeHtml(cleanPhone)}</span>
                </a>
              ` : ''}
            </div>
          </div>

          <!-- Items Ordered & Billing Box -->
          <div class="bg-slate-50/90 p-3 sm:p-4 rounded-2xl border border-slate-200/80 space-y-2.5">
            <div class="text-[11px] font-black text-slate-500 uppercase tracking-wider flex items-center justify-between">
              <span>Items for Delivery &amp; Billing:</span>
              <span class="text-blue-900 font-extrabold text-xs">🛍️ ${totalBags} Bags • ⚖️ ${totalWeightKg.toLocaleString('en-IN')} kg</span>
            </div>

            <div class="space-y-1.5 divide-y divide-slate-200/60">
              ${items.map(it => {
                const bQty = parseFloat(it.bagQty) || 0;
                const bSize = parseFloat(it.bagSize) || 25;
                const itKg = parseFloat(it.totalKg) || (bQty * bSize);
                const itRate = parseFloat(it.perKgRate) || 0;
                const itTotal = parseFloat(it.totalAmount) || Math.round(itKg * itRate);

                return `
                  <div class="pt-1.5 first:pt-0 flex flex-col sm:flex-row sm:items-center justify-between gap-1 text-xs">
                    <div class="font-bold text-slate-800 flex items-center gap-1.5 min-w-0">
                      <span class="text-amber-600">🌾</span>
                      <span class="font-black text-slate-900 truncate">${escapeHtml(it.productName || 'Rice')}</span>
                      <span class="text-[10px] font-semibold text-slate-500 bg-slate-200/80 px-1.5 py-0.2 rounded shrink-0">${bSize} kg/bag</span>
                    </div>

                    <div class="flex items-center gap-1.5 self-end sm:self-center flex-wrap shrink-0">
                      <!-- Bag count & Weight -->
                      <span class="font-extrabold text-blue-950 bg-white px-2 py-0.5 rounded-lg border border-slate-200 shadow-2xs">
                        ${bQty} Bags <span class="text-[10px] font-bold text-blue-600">(${itKg} kg)</span>
                      </span>

                      <!-- Per KG Rate -->
                      <span class="font-black text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200 text-xs" title="Rate per KG">
                        ₹${itRate}<span class="text-[10px] font-medium text-emerald-600">/kg</span>
                      </span>

                      <!-- Item Subtotal for Billing -->
                      <span class="font-black text-slate-900 bg-amber-50 px-2 py-0.5 rounded-lg border border-amber-200 text-xs" title="Item Total">
                        ₹${itTotal.toLocaleString('en-IN')}
                      </span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Order Weight & Bill Amount Summary Strip -->
            <div class="mt-2 pt-2 border-t border-slate-200 flex items-center justify-between text-xs bg-white px-3 py-2 rounded-xl border border-slate-200/90 shadow-2xs">
              <div class="flex items-center gap-2 sm:gap-3 text-[11px] sm:text-xs">
                <span class="font-bold text-slate-600">
                  Total: <strong class="text-slate-900 font-black">${totalBags} Bags</strong>
                </span>
                <span class="text-slate-300">•</span>
                <span class="font-bold text-blue-700">
                  Weight: <strong class="text-blue-950 font-black">${totalWeightKg.toLocaleString('en-IN')} kg</strong>
                </span>
              </div>
              <div class="text-right">
                <span class="text-[10px] text-slate-500 font-bold">Total Bill: </span>
                <span class="font-black text-emerald-700 text-sm sm:text-base">₹${Math.round(totalOrderAmount).toLocaleString('en-IN')}</span>
              </div>
            </div>

          </div>

          <!-- Owner's Order Note (if any) -->
          ${o.notes ? `
            <div class="p-2.5 rounded-xl bg-amber-50/80 border border-amber-200/90 text-xs text-amber-950 flex items-start gap-2">
              <span class="font-black shrink-0">📝 Office Note:</span>
              <span class="font-medium">${escapeHtml(o.notes)}</span>
            </div>
          ` : ''}

          <!-- Delivery Note / Remarks (if previously added) -->
          ${o.deliveryNote ? `
            <div class="p-3 rounded-2xl bg-emerald-50/90 border border-emerald-200 text-xs text-emerald-950 flex items-start justify-between gap-2 shadow-2xs">
              <div class="space-y-0.5 flex-1">
                <div class="font-black text-emerald-900 flex items-center gap-1.5">
                  <i data-lucide="message-square" class="w-3.5 h-3.5 text-emerald-600"></i>
                  <span>Delivery Remarks:</span>
                </div>
                <div class="font-semibold text-emerald-950 leading-relaxed text-xs sm:text-[13px] pl-5">
                  ${escapeHtml(o.deliveryNote)}
                </div>
                ${o.deliveredAt ? `<div class="text-[10px] text-emerald-700 font-bold pl-5 mt-1">⏰ Delivered: ${formatTime(o.deliveredAt)}</div>` : ''}
              </div>
              <button type="button" onclick="openDeliveryActionModal('${o.id}', 'note_only')" class="px-2.5 py-1 bg-white hover:bg-emerald-100 border border-emerald-200 text-[11px] text-emerald-800 font-bold rounded-lg hover:underline shrink-0 transition active:scale-95 shadow-2xs">Edit Remark</button>
            </div>
          ` : ''}

          <!-- Action Buttons Bar -->
          <div class="pt-2 flex items-center gap-2 flex-wrap border-t border-slate-100">
            ${!isDelivered ? `
              ${!isOut ? `
                <button type="button" onclick="setOutForDelivery('${o.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 transition active:scale-95 inline-flex items-center gap-1.5">
                  <i data-lucide="truck" class="w-3.5 h-3.5"></i>
                  <span>Out for Delivery</span>
                </button>
              ` : ''}
              <button type="button" onclick="openDeliveryActionModal('${o.id}', 'delivered')" class="flex-1 py-2.5 px-4 rounded-xl text-xs font-extrabold bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-sm active:scale-95 inline-flex items-center justify-center gap-1.5">
                <i data-lucide="check-circle" class="w-4 h-4"></i>
                <span>Mark as Delivered</span>
              </button>
              <button type="button" onclick="openDeliveryActionModal('${o.id}', 'note_only')" class="p-2.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-200 transition active:scale-95" title="Add delivery remark">
                <i data-lucide="file-text" class="w-4 h-4"></i>
              </button>
            ` : `
              <div class="flex-1 text-xs text-emerald-800 font-bold flex items-center gap-1.5">
                <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i>
                <span>Completed ${o.deliveredAt ? `(${formatTime(o.deliveredAt)})` : ''}</span>
              </div>
              <button type="button" onclick="openDeliveryActionModal('${o.id}', 'note_only')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition">
                <span>Edit Note</span>
              </button>
              <button type="button" onclick="revertToPending('${o.id}')" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-rose-600 hover:bg-rose-50 border border-rose-200 transition" title="Revert to pending delivery">
                <span>Revert</span>
              </button>
            `}
          </div>

        </div>
      `;
    }

    function getCustName(o) {
      let raw = 'Customer';
      if (!o.customer) raw = 'Customer';
      else if (typeof o.customer === 'string') raw = o.customer;
      else raw = o.customer.name || 'Customer';

      const lower = raw.trim().toLowerCase();
      if (lower === 'thanima' || lower === 'hotel thanima') return 'Thanima Hotel';
      if (lower === 'riyas') return 'Riyas Traders';
      if (lower === 'maj angamaly') return 'MAJ';
      if (lower === 'pkbr elamakkara') return 'PKBR';
      if (lower.includes('al-safi food court')) return 'Al-Safi Food Court';
      return raw;
    }

    function getCustTown(o) {
      if (!o.customer) return '';
      if (typeof o.customer === 'object') {
        return o.customer.town || o.customer.area || o.customer.location || '';
      }
      return '';
    }

    function getCustLandmark(o) {
      if (!o || !o.customer) return '';
      let lm = '';
      if (typeof o.customer === 'object') {
        if (o.customer.landmark && typeof o.customer.landmark === 'string' && o.customer.landmark.trim()) {
          lm = o.customer.landmark.trim();
        } else if (o.customer.place && typeof o.customer.place === 'string' && o.customer.place.trim() && o.customer.place !== o.customer.town && o.customer.place !== o.customer.area) {
          lm = o.customer.place.trim();
        }
      }
      if (!lm) {
        try {
          const rawCusts = localStorage.getItem('biriyani_rice_customers');
          if (rawCusts) {
            const custs = JSON.parse(rawCusts);
            if (Array.isArray(custs)) {
              const cName = getCustName(o).toLowerCase();
              const cId = (typeof o.customer === 'object' && o.customer.id) ? o.customer.id : null;
              const found = custs.find(c => (cId && c.id === cId) || (c.name && c.name.toLowerCase() === cName));
              if (found) {
                if (found.landmark && typeof found.landmark === 'string' && found.landmark.trim()) {
                  lm = found.landmark.trim();
                } else if (found.place && typeof found.place === 'string' && found.place.trim() && found.place !== found.town && found.place !== found.area) {
                  lm = found.place.trim();
                }
              }
            }
          }
        } catch (e) {}
      }
      return lm || '';
    }

    function getCustPhone(o) {
      if (!o.customer) return '';
      if (typeof o.customer === 'object') {
        return o.customer.phone || o.customer.ownerPhone || o.customer.staffPhone || '';
      }
      return '';
    }

    function formatTime(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return '';
      }
    }

    function escapeHtml(str) {
      if (!str && str !== 0) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setOutForDelivery(orderId) {
      if (!db || !orderId) return;
      const o = allOrders.find(item => item.id === orderId);
      if (!o) return;

      db.collection('orders').doc(orderId).update({
        dispatchStatus: 'OutForDelivery'
      }).then(() => {
        showToast(`🚚 Order ${orderId} marked: Out for Delivery`);
      }).catch(err => {
        console.error('Error updating status:', err);
        alert('Could not update status: ' + err.message);
      });
    }

    function revertToPending(orderId) {
      if (!confirm(`Move ${orderId} back to Pending Deliveries?`)) return;
      db.collection('orders').doc(orderId).update({
        dispatchStatus: 'Pending',
        deliveredAt: null
      }).then(() => {
        showToast(`↩️ Order ${orderId} reverted to Pending.`);
      }).catch(err => alert(err.message));
    }

    // ==================== QUICK DELIVERY REMARKS MANAGEMENT ====================
    const STORAGE_QUICK_REMARKS = 'thirdman_delivery_quick_remarks';
    const DEFAULT_QUICK_REMARKS = [
      '👨‍🍳 Handed over to Chef / Cook',
      '🏪 Delivered at Shop / Hotel',
      '👑 Received by Owner / Manager',
      '💵 Cash payment collected',
      '🥘 Gave to Kitchen staff'
    ];

    function getQuickRemarks() {
      try {
        const raw = localStorage.getItem(STORAGE_QUICK_REMARKS);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.filter(s => typeof s === 'string' && s.trim().length > 0);
          }
        }
      } catch (e) {}
      return [...DEFAULT_QUICK_REMARKS];
    }

    function saveQuickRemarks(arr) {
      const cleanArr = Array.isArray(arr) ? arr.map(s => String(s || '').trim()).filter(Boolean) : [...DEFAULT_QUICK_REMARKS];
      try {
        localStorage.setItem(STORAGE_QUICK_REMARKS, JSON.stringify(cleanArr));
      } catch (e) {}
      if (db) {
        try {
          db.collection('settings').doc('delivery_config').set({
            quickRemarks: cleanArr,
            updatedAt: new Date().toISOString()
          }, { merge: true }).catch(err => console.warn('Could not sync quickRemarks to Firestore:', err));
        } catch (err) {}
      }
      renderQuickRemarkChips();
    }

    function syncQuickRemarksFromCloud() {
      if (!db) return;
      try {
        db.collection('settings').doc('delivery_config').get().then(doc => {
          if (doc && doc.exists) {
            const data = doc.data();
            if (data && Array.isArray(data.quickRemarks) && data.quickRemarks.length > 0) {
              localStorage.setItem(STORAGE_QUICK_REMARKS, JSON.stringify(data.quickRemarks));
              renderQuickRemarkChips();
            }
          }
        }).catch(() => {});
      } catch (e) {}
    }

    function syncLogoFromCloud() {
      if (!db) return;
      try {
        db.collection('settings').doc('app_config').onSnapshot(doc => {
          if (doc && doc.exists) {
            const cfg = doc.data();
            if (cfg && cfg.appLogo && typeof cfg.appLogo === 'string' && cfg.appLogo.trim()) {
              try {
                localStorage.setItem('thirdman_app_logo', cfg.appLogo);
              } catch (e) {}
              const logoEl = document.getElementById('deliveryHeaderLogo');
              if (logoEl) logoEl.src = cfg.appLogo;
            }
          }
        }, err => console.warn('Could not sync logo in delivery portal:', err));
      } catch (e) {}
    }

    function renderQuickRemarkChips() {
      const container = document.getElementById('quickRemarksContainer');
      if (!container) return;
      const remarks = getQuickRemarks();
      if (remarks.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-400 italic">No quick remarks saved. Click 'Edit Remarks' to add.</span>`;
        return;
      }
      container.innerHTML = remarks.map(rem => {
        return `<button type="button" onclick="appendQuickRemark(${JSON.stringify(rem)})" class="px-2.5 py-1 bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 rounded-lg text-xs font-semibold transition active:scale-95 flex items-center gap-1 shadow-2xs"><span>${escapeHtml(rem)}</span></button>`;
      }).join('');
      if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
    }

    function openManageRemarksModal() {
      const modal = document.getElementById('manageRemarksModal');
      if (!modal) return;
      const listEl = document.getElementById('manageRemarksList');
      const remarks = getQuickRemarks();
      if (listEl) {
        listEl.innerHTML = remarks.map(rem => `
          <div class="manage-remark-row flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
            <input type="text" class="manage-remark-input flex-1 text-xs p-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/20 font-medium text-slate-800" value="${escapeHtml(rem)}">
            <button type="button" onclick="this.closest('.manage-remark-row').remove(); updateManageRemarksCount();" class="p-1.5 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded-lg transition" title="Delete">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `).join('');
      }
      const newInp = document.getElementById('newRemarkTextInput');
      if (newInp) newInp.value = '';
      updateManageRemarksCount();
      modal.classList.remove('hidden');
      if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
    }

    function closeManageRemarksModal() {
      const modal = document.getElementById('manageRemarksModal');
      if (modal) modal.classList.add('hidden');
    }

    function updateManageRemarksCount() {
      const listEl = document.getElementById('manageRemarksList');
      const countEl = document.getElementById('manageRemarksCount');
      if (countEl && listEl) {
        countEl.textContent = listEl.querySelectorAll('.manage-remark-row').length;
      }
    }

    function addNewQuickRemark() {
      const newInp = document.getElementById('newRemarkTextInput');
      const val = (newInp?.value || '').trim();
      if (!val) return;
      const listEl = document.getElementById('manageRemarksList');
      if (!listEl) return;
      const row = document.createElement('div');
      row.className = 'manage-remark-row flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200';
      row.innerHTML = `
        <input type="text" class="manage-remark-input flex-1 text-xs p-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/20 font-medium text-slate-800" value="${escapeHtml(val)}">
        <button type="button" onclick="this.closest('.manage-remark-row').remove(); updateManageRemarksCount();" class="p-1.5 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded-lg transition" title="Delete">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        </button>
      `;
      listEl.appendChild(row);
      newInp.value = '';
      newInp.focus();
      updateManageRemarksCount();
      if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
    }

    function saveQuickRemarksFromManageModal() {
      const listEl = document.getElementById('manageRemarksList');
      if (!listEl) return;
      const inputs = listEl.querySelectorAll('.manage-remark-input');
      const newRemarks = [];
      inputs.forEach(inp => {
        const v = inp.value.trim();
        if (v) newRemarks.push(v);
      });
      if (newRemarks.length === 0) {
        alert('കുറഞ്ഞത് ഒരു റിമാർക്ക് എങ്കിലും ഉണ്ടായിരിക്കണം! (Please keep at least one remark)');
        return;
      }
      saveQuickRemarks(newRemarks);
      closeManageRemarksModal();
      showToast('✅ Selection remarks updated!');
    }

    function resetQuickRemarksToDefault() {
      if (!confirm('എല്ലാ റിമാർക്സുകളും ഡിഫോൾട്ട് ആക്കി റീസെറ്റ് ചെയ്യണമോ? (Reset all quick remarks to default?)')) {
        return;
      }
      saveQuickRemarks([...DEFAULT_QUICK_REMARKS]);
      openManageRemarksModal();
      showToast('↺ Quick remarks reset to default!');
    }

    function appendQuickRemark(text) {
      const input = document.getElementById('modalDeliveryNoteInput');
      if (!input) return;
      const cleanText = String(text || '').trim();
      if (!cleanText) return;
      if (input.value && input.value.trim().length > 0) {
        if (!input.value.includes(cleanText)) {
          input.value = input.value.trim() + ' • ' + cleanText;
        }
      } else {
        input.value = cleanText;
      }
      input.focus();
    }

    function openDeliveryActionModal(orderId, type = 'delivered') {
      activeActionOrderId = orderId;
      activeActionType = type;
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;

      renderQuickRemarkChips();

      const modal = document.getElementById('deliveryActionModal');
      const title = document.getElementById('modalActionTitle');
      const subtitle = document.getElementById('modalCustomerSubtitle');
      const noteInput = document.getElementById('modalDeliveryNoteInput');
      const submitBtnText = document.getElementById('btnConfirmSubmitText');

      if (title) title.textContent = (type === 'delivered') ? 'Confirm Delivery' : 'Update Delivery Remarks';
      if (subtitle) subtitle.textContent = `${getCustName(order)} • ${order.id}`;
      if (noteInput) noteInput.value = order.deliveryNote || '';
      if (submitBtnText) submitBtnText.textContent = (type === 'delivered') ? 'Mark as Delivered' : 'Save Remarks';

      if (modal) modal.classList.remove('hidden');
      noteInput?.focus();

      if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
    }

    function closeDeliveryActionModal() {
      const modal = document.getElementById('deliveryActionModal');
      if (modal) modal.classList.add('hidden');
      activeActionOrderId = null;
    }

    function submitDeliveryAction() {
      if (!db || !activeActionOrderId) return;
      const noteInput = document.getElementById('modalDeliveryNoteInput');
      const noteText = (noteInput?.value || '').trim();

      const updatePayload = {
        deliveryNote: noteText
      };

      if (activeActionType === 'delivered') {
        updatePayload.dispatchStatus = 'Delivered';
        updatePayload.deliveredAt = new Date().toISOString();
      }

      db.collection('orders').doc(activeActionOrderId).update(updatePayload).then(() => {
        showToast(activeActionType === 'delivered' ? `✅ Order ${activeActionOrderId} delivered!` : `📝 Note updated!`);
        closeDeliveryActionModal();
      }).catch(err => {
        console.error('Error saving delivery status:', err);
        alert('Error: ' + err.message);
      });
    }

    function markAllPendingDelivered() {
      const pendingOrders = allOrders.filter(o => o.dispatchStatus !== 'Delivered');
      if (pendingOrders.length === 0) {
        alert('പെൻഡിങ് ഡെലിവറികൾ ഒന്നുമില്ല! (No pending deliveries to mark)');
        return;
      }
      if (!confirm(`നിലവിലുള്ള ${pendingOrders.length} പെൻഡിങ് ഓർഡറുകളും 'Delivered' ആയി മാർക്ക് ചെയ്യണമോ?\n(Mark all ${pendingOrders.length} pending orders as Delivered?)`)) {
        return;
      }
      const nowIso = new Date().toISOString();
      pendingOrders.forEach(o => {
        o.dispatchStatus = 'Delivered';
        o.deliveredAt = o.deliveredAt || nowIso;
      });
      try {
        localStorage.setItem(STORAGE_DELIVERY_CACHE, JSON.stringify(allOrders));
      } catch (e) {}
      if (db) {
        syncOrdersDispatchStatusToFirestore(pendingOrders);
      }
      showToast(`✅ ${pendingOrders.length} orders marked as Delivered!`);
      updateTabBadges();
      renderOrders();
    }

    // Auto-resync & socket wake-up when returning to delivery portal (e.g. mobile unlock, tab focus, online event)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && db) {
        if (typeof db.enableNetwork === 'function') db.enableNetwork().catch(() => {});
        fetchOrdersDirect();
      }
    });

    window.addEventListener('online', () => {
      if (db && typeof db.enableNetwork === 'function') db.enableNetwork().catch(() => {});
      fetchOrdersDirect();
    });

    window.addEventListener('focus', () => {
      if (db && typeof db.enableNetwork === 'function') db.enableNetwork().catch(() => {});
    });

    setInterval(() => {
      if (document.visibilityState === 'visible' && db && typeof db.enableNetwork === 'function') {
        db.enableNetwork().catch(() => {});
      }
    }, 45000);

    function startDeliveryApp() {
      updateViewModeButtons();
      renderQuickRemarkChips();
      try {
        const customLogo = localStorage.getItem('thirdman_app_logo');
        const logoEl = document.getElementById('deliveryHeaderLogo');
        if (logoEl) {
          if (customLogo) logoEl.src = customLogo;
          else logoEl.src = 'uploaded-logo.png';
        }
      } catch (e) {}
      initFirebase();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startDeliveryApp);
    } else {
      startDeliveryApp();
    }
  </script>
</body>
</html>
